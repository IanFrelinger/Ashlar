name: Dogfood isolation validation
on:
  push:
    branches: [codex/dogfood-isolation-validation]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full orchestration suite
        id: orchestration
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-in-container.sh --ref 9273386b6680fcb6f2a8f6ac3d8e9f0736714a29 -- 'dotnet test src/Ashlar.Tests.Orchestration/Ashlar.Tests.Orchestration.csproj --framework net8.0 --nologo -v minimal' 2>&1 | tee suite.log
      - name: SDK newcomer probe
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-in-container.sh --ref 9273386b6680fcb6f2a8f6ac3d8e9f0736714a29 -- 'set -euo pipefail; probe_dir=$(mktemp -d /tmp/ashlar-sdk-panel.XXXXXX); printf "%s" "" | base64 --decode > "$probe_dir/SdkProbe.csproj"; printf "%s" "" | base64 --decode > "$probe_dir/Program.cs"; dotnet run --project "$probe_dir/SdkProbe.csproj" -p:AshlarRoot=/repo --framework net8.0' 2>&1 | tee sdk-probe.log
      - name: Serial mutation red restore green evidence
        if: ${{ !cancelled() && steps.orchestration.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-in-container.sh --ref 9273386b6680fcb6f2a8f6ac3d8e9f0736714a29 -- 'python3 scripts/run-spec007-mutation-batch.py --manifest scripts/mutations/run-isolation.json --archive-stdout' 2>&1 | tee mutations.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolation-validation-evidence
          path: |
            suite.log
            sdk-probe.log
            mutations.log
