# Full Platform Readiness Gate
#
# Verifies setup, discovery, and dry-run on every target platform.
# Stages per platform:
#   1. Setup  — environment bootstrap (setup scripts + dotnet restore + build)
#   2. Discovery — `ashlar doctor --json` + `ashlar bootstrap check --json` + `ashlar pipeline diagnostics --format-json`
#   3. Dry-run — `ashlar doctor --fix --dry-run --json` + `ashlar bootstrap apply --dry-run --json` + smoke tests
#
# Native runners: ubuntu, macOS, Windows
# Container runners: Ubuntu, Alpine, Debian (Docker on ubuntu-latest)
#
# Trigger policy (see .github/workflows/README.md, docs/CiGateInventory.md):
#   - pull_request: UNFILTERED on purpose. The `changes` job decides in-workflow whether any
#     core path (READINESS_PATHS below) is in the PR diff; only then do the heavy platform
#     lanes run. Otherwise they are skipped and "Readiness summary" passes in ~1 minute.
#     This is what lets "Readiness summary" become a required status check later without
#     deadlock: a required context that never reports leaves a PR at "Expected — Waiting for
#     status" forever, and enforce_admins=true means nobody can bypass it.
#   - push (master/main/cursor/**), schedule, workflow_dispatch: always run the heavy lanes.
name: Full Platform Readiness Gate

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  # No `paths:` filter here on purpose — every PR must get a "Readiness summary" status.
  # Path scoping for PRs happens in the `changes` job below.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master, main, "cursor/**"]
    # KEEP IN SYNC with READINESS_PATHS in the `changes` job below. YAML anchors do not work
    # across `on:` and `jobs:` in GitHub Actions, so the list is duplicated by necessity.
    paths:
      - ".github/workflows/full-platform-readiness-gate.yml"
      - ".docker/Dockerfile.*"
      - "scripts/setup/**"
      - "scripts/install/**"
      - "application/src/Ashlar.CLI/**"
      - "src/Ashlar.Hosting/**"
      - "src/Ashlar.Abstractions/**"
      - "src/Ashlar.AI.Pipeline/**"
      - "src/Ashlar.Tests.AI.Pipeline/**"
      - "src/Ashlar.Core.Domain/**"
      - "src/Ashlar.Core.Application/**"
      - "src/Ashlar.Brick.Contracts/**"
      - "src/Ashlar.Policies/**"
      - "src/Ashlar.Tools.Assembly/**"
      - "src/Ashlar.Tools.Dev/**"
      - "src/Ashlar.Transport.Grpc/**"
      - "src/Ashlar.Runtime/**"
      - "src/Ashlar.Infrastructure/**"
      - "src/Ashlar.Orchestration/**"
      - "src/Ashlar.BackgroundAgents/**"
      - "src/Ashlar.Tests.BackgroundAgents/**"
      - "src/Ashlar.Tests.Infrastructure/**"
      # Added after PR #561 (CLI + Fleet test fixes): its branch touched only the CLI test
      # project, commercial/ and the orchestration/kernel test projects, none of which were
      # listed, so the gate never ran and the fix could not be gate-proven before merge.
      - "application/src/Ashlar.Tests.CLI/**"
      - "commercial/**"
      - "src/Ashlar.Tests.Orchestration/**"
      - "src/Ashlar.Tests.Kernel/**"
      - "scripts/pack-ashlar-hosting-graph.sh"
      - "scripts/pack-ashlar-hosting-graph.ps1"
      - "scripts/verify-stable-sdk-host-sample-packages.sh"
      - "scripts/verify-stable-sdk-host-sample-packages.ps1"
      - "docs/samples/StableSdkHostSample/**"
      - "docs/samples/NugetOrgRestoreVerify/**"
      - "global.json"
      - "Directory.Build.props"
      - "src/Directory.Build.props"
      - "VERSION"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
  workflow_dispatch:

concurrency:
  group: full-platform-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ASHLAR_STRICT_MODE: 1
  ASHLAR_ALLOW_MOCK: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Change detection: does this PR touch a core path? (~30s)
  # On push / schedule / workflow_dispatch there is no PR base, so run_heavy is
  # unconditionally true and this job is a no-op pass-through.
  # ─────────────────────────────────────────────────────────────────────
  changes:
    name: "Changes — core paths touched?"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_heavy: ${{ steps.filter.outputs.run_heavy }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the heavy platform lanes must run
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Event is '$EVENT_NAME' (no PR base to diff against) — heavy lanes run unconditionally."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # KEEP IN SYNC with `on.push.paths` at the top of this file (same globs, same order).
          # `**` is rewritten to `*` for bash matching: an unquoted `*` in [[ == ]] matches `/` too.
          READINESS_PATHS=(
            ".github/workflows/full-platform-readiness-gate.yml"
            ".docker/Dockerfile.*"
            "scripts/setup/**"
            "scripts/install/**"
            "application/src/Ashlar.CLI/**"
            "src/Ashlar.Hosting/**"
            "src/Ashlar.Abstractions/**"
            "src/Ashlar.AI.Pipeline/**"
            "src/Ashlar.Tests.AI.Pipeline/**"
            "src/Ashlar.Core.Domain/**"
            "src/Ashlar.Core.Application/**"
            "src/Ashlar.Brick.Contracts/**"
            "src/Ashlar.Policies/**"
            "src/Ashlar.Tools.Assembly/**"
            "src/Ashlar.Tools.Dev/**"
            "src/Ashlar.Transport.Grpc/**"
            "src/Ashlar.Runtime/**"
            "src/Ashlar.Infrastructure/**"
            "src/Ashlar.Orchestration/**"
            "src/Ashlar.BackgroundAgents/**"
            "src/Ashlar.Tests.BackgroundAgents/**"
            "src/Ashlar.Tests.Infrastructure/**"
            # Added after PR #561 (CLI + Fleet test fixes) — see the matching comment in on.push.paths.
            "application/src/Ashlar.Tests.CLI/**"
            "commercial/**"
            "src/Ashlar.Tests.Orchestration/**"
            "src/Ashlar.Tests.Kernel/**"
            "scripts/pack-ashlar-hosting-graph.sh"
            "scripts/pack-ashlar-hosting-graph.ps1"
            "scripts/verify-stable-sdk-host-sample-packages.sh"
            "scripts/verify-stable-sdk-host-sample-packages.ps1"
            "docs/samples/StableSdkHostSample/**"
            "docs/samples/NugetOrgRestoreVerify/**"
            "global.json"
            "Directory.Build.props"
            "src/Directory.Build.props"
            "VERSION"
            "Directory.Build.targets"
            "Directory.Packages.props"
          )

          if [[ -z "${BASE_SHA:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "::warning::Missing PR base/head SHA — failing safe: heavy lanes will run."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "::warning::Could not compute merge-base of $BASE_SHA and $HEAD_SHA — failing safe: heavy lanes will run."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")
          echo "Merge-base: $MERGE_BASE  Head: $HEAD_SHA"
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          RUN_HEAVY=false
          MATCHED=()
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            for pat in "${READINESS_PATHS[@]}"; do
              bash_pat="${pat//\*\*/*}"
              # shellcheck disable=SC2053  # unquoted RHS is intentional: glob match
              if [[ "$f" == $bash_pat ]]; then
                MATCHED+=("$f  (matches $pat)")
                RUN_HEAVY=true
                break
              fi
            done
          done <<< "$CHANGED"

          if [[ "$RUN_HEAVY" == "true" ]]; then
            echo "Core paths touched — heavy platform lanes will run:"
            printf '  %s\n' "${MATCHED[@]}"
          else
            echo "No core path touched — heavy platform lanes are skipped; Readiness summary will pass."
          fi
          echo "run_heavy=$RUN_HEAVY" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────
  # Native runners: Ubuntu, macOS, Windows
  # ─────────────────────────────────────────────────────────────────────
  native-platform:
    name: "${{ matrix.label }} — setup · discover · dry-run"
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            setup_cmd: bash scripts/setup/setup.sh
          - os: macos-latest
            label: macOS
            setup_cmd: bash scripts/setup/setup.sh
          - os: windows-latest
            label: Windows
            setup_cmd: pwsh scripts/setup/setup.ps1 -Mode

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SDK 10 only, on purpose: this is what the docs tell a native user to install. The CLI/API
      # ship net10.0; the net8.0 test hosts and samples rely on RollForward=Major
      # (Directory.Build.targets) to run on the 10.x runtime; installing 8.0.x here used to hide a
      # broken first `dotnet run`. Container lanes keep their own runtime setup.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: "Setup — verify hosting pack graph consistency"
        run: python3 scripts/verify-pack-ashlar-hosting-graph-alignment.py

      # ── Stage 1: Setup ──────────────────────────────────────────────
      - name: "Setup — check environment"
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pwsh -NoProfile -File scripts/setup/setup.ps1 -Mode check
          else
            bash scripts/setup/setup.sh check
          fi

      - name: "Setup — restore dependencies"
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pwsh -NoProfile -File scripts/setup/setup.ps1 -Mode restore
          else
            bash scripts/setup/setup.sh restore
          fi

      - name: "Setup — build CLI"
        run: dotnet build application/src/Ashlar.CLI/Ashlar.CLI.csproj --no-restore -v minimal

      # Hosted runner images may still carry a preinstalled 8.0 runtime, so "it ran" alone would not
      # prove the roll-forward policy survived. Assert the generated runtimeconfig directly.
      - name: "Setup — verify CLI runtimeconfig rolls forward across majors"
        shell: bash
        run: |
          cfg=application/src/Ashlar.CLI/bin/Debug/net10.0/Ashlar.CLI.runtimeconfig.json
          grep -q '"rollForward": "Major"' "$cfg" || {
            echo "::error::$cfg lacks \"rollForward\": \"Major\" — a machine with only a newer major runtime cannot run the CLI"
            cat "$cfg"
            exit 1
          }

      - name: "Setup — verify CLI starts"
        run: dotnet run --project application/src/Ashlar.CLI --no-build -- --help

      - name: "Setup — build SDK sample"
        run: dotnet build docs/samples/StableSdkHostSample/StableSdkHostSample.csproj -v minimal

      - name: "Setup — verify SDK sample consumes local NuGet graph"
        shell: bash
        env:
          ASHLAR_SDK_PACKAGE_VERSION: 1.0.0-ci
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pwsh -NoProfile -File scripts/verify-stable-sdk-host-sample-packages.ps1 -Version "${ASHLAR_SDK_PACKAGE_VERSION}"
          else
            bash scripts/verify-stable-sdk-host-sample-packages.sh
          fi

      # ── Stage 2: Discovery ──────────────────────────────────────────
      - name: "Discover — doctor report"
        shell: bash
        run: |
          set +e
          dotnet run --project application/src/Ashlar.CLI --no-build -- doctor --json \
            2>&1 | tee "${{ runner.temp }}/doctor-report.json"
          echo "doctor_exit=$?" >> "$GITHUB_ENV"

      - name: "Discover — bootstrap check"
        shell: bash
        run: |
          dotnet run --project application/src/Ashlar.CLI --no-build -- bootstrap check --json \
            2>&1 | tee "${{ runner.temp }}/bootstrap-check.json"

      - name: "Discover — pipeline diagnostics"
        shell: bash
        run: |
          set +e
          dotnet run --project application/src/Ashlar.CLI --no-build -- pipeline diagnostics --format-json \
            2>&1 | tee "${{ runner.temp }}/pipeline-diagnostics.json"
          true  # pipeline diagnostics may fail without a template; non-fatal

      - name: "Discover — ci verify (build + smoke + arch)"
        shell: bash
        run: |
          dotnet run --project application/src/Ashlar.CLI --no-build -- ci verify

      # ── Stage 3: Dry-run ────────────────────────────────────────────
      - name: "Dry-run — doctor remediation"
        shell: bash
        run: |
          dotnet run --project application/src/Ashlar.CLI --no-build -- doctor --fix --dry-run --json \
            2>&1 | tee "${{ runner.temp }}/doctor-dryrun.json"

      - name: "Dry-run — bootstrap apply"
        shell: bash
        run: |
          dotnet run --project application/src/Ashlar.CLI --no-build -- bootstrap apply --dry-run --json \
            2>&1 | tee "${{ runner.temp }}/bootstrap-dryrun.json"

      - name: "Dry-run — build + run smoke tests"
        shell: bash
        run: |
          rm -f src/Ashlar.Tests.Infrastructure/scripts/obj/project.assets.json
          dotnet build src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj -v minimal
          dotnet build src/Ashlar.Tests.BackgroundAgents/Ashlar.Tests.BackgroundAgents.csproj -v minimal
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 450s \
            --blame-hang-dump-type none \
            --filter "(FullyQualifiedName~BaseFrameworkSmokeTests|FullyQualifiedName~RuntimeStudioBlackBoxSmokeTests)" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=smoke-${{ matrix.label }}.trx" \
            --results-directory "${{ runner.temp }}/test-results"
          dotnet test src/Ashlar.Tests.BackgroundAgents/Ashlar.Tests.BackgroundAgents.csproj \
            --no-build \
            --blame-hang-timeout 60s \
            --blame-hang-dump-type none \
            --filter "FullyQualifiedName~RuntimeStudioWhiteBoxSmokeTests" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=smoke-whitebox-${{ matrix.label }}.trx" \
            --results-directory "${{ runner.temp }}/test-results"

      # ── Artifacts ───────────────────────────────────────────────────
      - name: Upload readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/doctor-report.json
            ${{ runner.temp }}/bootstrap-check.json
            ${{ runner.temp }}/pipeline-diagnostics.json
            ${{ runner.temp }}/doctor-dryrun.json
            ${{ runner.temp }}/bootstrap-dryrun.json
            ${{ runner.temp }}/test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # Container runners: Ubuntu, Alpine, Debian
  # ─────────────────────────────────────────────────────────────────────
  container-platform:
    name: "${{ matrix.label }} (container) — setup · discover · dry-run"
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: .docker/Dockerfile.test-caching
            label: Ubuntu-Container
            build_arg: "DOTNET_VERSION=10.0"
          - dockerfile: .docker/Dockerfile.test-caching-alpine
            label: Alpine-Container
            build_arg: "DOTNET_VERSION=10.0"
          - dockerfile: .docker/Dockerfile.test-caching-debian
            label: Debian-Container
            build_arg: "DOTNET_VERSION=10.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      # ── Stage 1: Setup (build container) ────────────────────────────
      - name: "Setup — build container image"
        id: container-build
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            --build-arg ${{ matrix.build_arg }} \
            -t ashlar-readiness:${{ matrix.label }} \
            .

      # ── Stage 2 + 3: Discovery + Dry-run inside container ──────────
      - name: "Discover + Dry-run in container"
        if: steps.container-build.outcome == 'success'
        run: |
          mkdir -p "${{ runner.temp }}/container-results"
          docker run --rm \
            -e ASHLAR_STRICT_MODE=1 \
            -e ASHLAR_ALLOW_MOCK=1 \
            -e DOTNET_RUNNING_IN_CONTAINER=true \
            -v "${{ runner.temp }}/container-results:/results" \
            ashlar-readiness:${{ matrix.label }} \
            bash -c '
              set -euo pipefail

              echo "=== CLI smoke ==="
              dotnet run --project application/src/Ashlar.CLI --no-build -- --help

              echo "=== Discover: bootstrap check ==="
              dotnet run --project application/src/Ashlar.CLI --no-build -- bootstrap check --json \
                2>&1 | tee /results/bootstrap-check.json

              echo "=== Dry-run: bootstrap apply ==="
              dotnet run --project application/src/Ashlar.CLI --no-build -- bootstrap apply --dry-run --json \
                2>&1 | tee /results/bootstrap-dryrun.json

              echo "=== Smoke tests ==="
              dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
                -f net10.0 \
                --no-build \
                --blame-hang-timeout 450s \
                --blame-hang-dump-type none \
                --filter "(FullyQualifiedName~BaseFrameworkSmokeTests|FullyQualifiedName~RuntimeStudioBlackBoxSmokeTests)" \
                --logger "console;verbosity=minimal" \
                --logger "trx;LogFileName=smoke.trx" \
                --results-directory /results/test-results
              dotnet test src/Ashlar.Tests.BackgroundAgents/Ashlar.Tests.BackgroundAgents.csproj \
                -f net10.0 \
                --no-build \
                --blame-hang-timeout 60s \
                --blame-hang-dump-type none \
                --filter "FullyQualifiedName~RuntimeStudioWhiteBoxSmokeTests" \
                --logger "console;verbosity=minimal" \
                --logger "trx;LogFileName=smoke-whitebox.trx" \
                --results-directory /results/test-results

              echo "=== All stages completed ==="
            '

      # ── Artifacts ───────────────────────────────────────────────────
      - name: Upload container readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ matrix.label }}
          path: ${{ runner.temp }}/container-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────
  # Docker CLI image: build + discover + dry-run
  # ─────────────────────────────────────────────────────────────────────
  docker-cli-image:
    name: "Docker CLI image — build · smoke · discover"
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Setup — build CLI Docker image"
        run: docker build -f .docker/Dockerfile.cli -t ashlar-cli:readiness .

      - name: "Discover — CLI help"
        run: docker run --rm ashlar-cli:readiness --help

      - name: "Discover — doctor"
        run: |
          docker run --rm \
            -e ASHLAR_STRICT_MODE=1 \
            -e ASHLAR_ALLOW_MOCK=1 \
            ashlar-cli:readiness doctor --json || true

      - name: "Discover — bootstrap check"
        run: |
          docker run --rm \
            -e ASHLAR_ALLOW_MOCK=1 \
            ashlar-cli:readiness bootstrap check --json

  # ─────────────────────────────────────────────────────────────────────
  # All production Docker images: build + smoke
  # ─────────────────────────────────────────────────────────────────────
  docker-all-images:
    name: "Docker ${{ matrix.label }} — build · smoke"
    needs: changes
    # Production images are never built on PRs (kept from before the PR trigger existed);
    # on push/schedule/dispatch they additionally follow the shared run_heavy decision.
    if: github.event_name != 'pull_request' && needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    # Builds take ~1 minute each (layer cache); the smoke below is bounded at 2 minutes.
    # The previous 90-minute budget only ever measured how long a hung smoke could hang.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: .docker/Dockerfile.api
            label: api
          - dockerfile: .docker/Dockerfile.quickstart
            label: quickstart
          - dockerfile: .docker/Dockerfile.agent-server
            label: agent-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Build ${{ matrix.label }}"
        run: docker build -f ${{ matrix.dockerfile }} -t ashlar-${{ matrix.label }}:gate .

      # All three images ENTRYPOINT `dotnet Ashlar.API.dll` on :8080 with a /health HEALTHCHECK.
      # The old smoke ran `dotnet Ashlar.API.dll --help || true` — an ASP.NET host does not treat
      # --help as a switch, it starts the server and runs forever, so the step hung until the
      # job timeout on every run. Smoke the thing the image is for instead: start it with the
      # mock provider and require /health to answer, the same shape as
      # scripts/ci/distribution-matrix-api-http-smoke.sh.
      - name: "Smoke ${{ matrix.label }} — start, /health"
        run: |
          set -euo pipefail
          name="ashlar-${{ matrix.label }}-gate"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" -p 18080:8080 -e ASHLAR_ALLOW_MOCK=1 "ashlar-${{ matrix.label }}:gate"
          start=$(date +%s)
          until curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; do
            if (( $(date +%s) - start > 120 )); then
              echo "::error::${{ matrix.label }}: /health did not answer within 120s"
              docker logs "$name" >&2 || true
              exit 1
            fi
            sleep 2
          done
          echo "${{ matrix.label }}: /health OK after $(( $(date +%s) - start ))s"
          curl -fsS http://127.0.0.1:18080/health | head -c 256 || true
          echo

  # ─────────────────────────────────────────────────────────────────────
  # Summary gate: fails if any platform failed.
  # Always runs (if: always()) and always reports, which is what makes "Readiness summary"
  # safe to require in branch protection. A heavy lane that was *skipped* (no core path in
  # the PR diff, or docker-all-images on a PR) counts as a pass; failure/cancelled fail.
  # ─────────────────────────────────────────────────────────────────────
  readiness-summary:
    name: "Readiness summary"
    runs-on: ubuntu-latest
    needs: [changes, native-platform, container-platform, docker-cli-image, docker-all-images]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Summarize results
        shell: bash
        run: |
          echo "## Full Platform Readiness Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"

          OVERALL=0

          # The change detector must itself have succeeded: if it failed, every heavy lane was
          # skipped because of a broken detector, not because nothing relevant changed.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "::error::changes job result was '${{ needs.changes.result }}' — cannot trust the skip decision."
            OVERALL=1
          fi

          if [[ "${{ needs.changes.outputs.run_heavy }}" != "true" ]]; then
            echo "Heavy platform lanes were skipped: no core path in this PR's diff (see the 'changes' job)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          for job_status in "${{ needs.native-platform.result }}" "${{ needs.container-platform.result }}" "${{ needs.docker-cli-image.result }}" "${{ needs.docker-all-images.result }}"; do
            case "$job_status" in
              success) ;;
              skipped)
                echo "::notice::Job result was skipped (heavy lane not required for this event/diff); counted as a pass."
                ;;
              *)
                # failure or cancelled
                OVERALL=1
                ;;
            esac
          done

          echo "| Linux (native) | ${{ needs.native-platform.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| macOS (native) | ${{ needs.native-platform.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Windows (native) | ${{ needs.native-platform.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ubuntu container | ${{ needs.container-platform.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Alpine container | ${{ needs.container-platform.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Debian container | ${{ needs.container-platform.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker CLI image | ${{ needs.docker-cli-image.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker API/quickstart/agent-server | ${{ needs.docker-all-images.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$OVERALL" -eq 0 ]]; then
            echo "**Result: ALL PLATFORMS PASSED**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result: ONE OR MORE PLATFORMS FAILED**" >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $OVERALL
