name: perf-gate

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/perf-gate*.sh'
      - 'src/Ashlar.Tests.Orchestration/**'
      - 'src/Ashlar.Tests.BackgroundAgents/**'
      - 'src/Ashlar.Infrastructure/**'
      - 'src/Ashlar.Core.Application/**'
      - 'src/Ashlar.Core.Domain/**'
      - 'src/Ashlar.Orchestration/**'

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.403
            8.0.427
      - name: Run perf gate
        run: PERF_GATE_SKIP_PRIOR=1 bash scripts/perf-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-gate-${{ github.run_id }}
          path: .ashlar/perf/
