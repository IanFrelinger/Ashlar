# DORMANT: manual-only, last dispatched 2026-05-23 (12 of the last 15 runs green). No automatic
# trigger can fire it. Kept because docs/production-readiness/KernelHardeningPlan-v1.md (C1) names
# it and the Dockerfile.test-caching* images it uses are still validated by compose-gate.yml.
# 2026-08-16, PR ci/workflow-pruning.
#
# Run Trust tests across Ubuntu, Alpine, and Debian Docker containers.
# Validates Trust & Information Architecture features (sanitization, knowledge log, access boundary, audit).
name: Trust Tests (Multi-Env Docker)

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  trust-ubuntu:
    name: Trust - Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build & run Trust tests (Ubuntu)
        run: |
          docker build -f .docker/Dockerfile.test-caching -t ashlar-trust:ubuntu .
          mkdir -p test-results/trust
          docker run --rm -v "${{ github.workspace }}/test-results/trust:/workspace/test-results" ashlar-trust:ubuntu bash -c \
            "cd /workspace && dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj -f net10.0 --filter 'FullyQualifiedName~Trust' --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=trust-infra-ubuntu.trx' --results-directory /workspace/test-results && \
             dotnet test src/Ashlar.Tests.BackgroundAgents/Ashlar.Tests.BackgroundAgents.csproj -f net10.0 --filter 'FullyQualifiedName~Trust' --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=trust-bg-ubuntu.trx' --results-directory /workspace/test-results"
          bash scripts/ci/zero-test-guard.sh test-results/trust/trust-infra-ubuntu.trx test-results/trust/trust-bg-ubuntu.trx
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: test-results/trust/**/*.trx
          check_name: Trust Tests - Ubuntu
          comment_mode: off
          report_individual_runs: true

  trust-alpine:
    name: Trust - Alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build & run Trust tests (Alpine)
        run: |
          docker build -f .docker/Dockerfile.test-caching-alpine -t ashlar-trust:alpine .
          mkdir -p test-results/trust
          docker run --rm -v "${{ github.workspace }}/test-results/trust:/workspace/test-results" ashlar-trust:alpine bash -c \
            "cd /workspace && dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj -f net10.0 --filter 'FullyQualifiedName~Trust' --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=trust-infra-alpine.trx' --results-directory /workspace/test-results && \
             dotnet test src/Ashlar.Tests.BackgroundAgents/Ashlar.Tests.BackgroundAgents.csproj -f net10.0 --filter 'FullyQualifiedName~Trust' --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=trust-bg-alpine.trx' --results-directory /workspace/test-results"
          bash scripts/ci/zero-test-guard.sh test-results/trust/trust-infra-alpine.trx test-results/trust/trust-bg-alpine.trx
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: test-results/trust/**/*.trx
          check_name: Trust Tests - Alpine
          comment_mode: off
          report_individual_runs: true

  trust-debian:
    name: Trust - Debian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build & run Trust tests (Debian)
        run: |
          docker build -f .docker/Dockerfile.test-caching-debian -t ashlar-trust:debian .
          mkdir -p test-results/trust
          docker run --rm -v "${{ github.workspace }}/test-results/trust:/workspace/test-results" ashlar-trust:debian bash -c \
            "cd /workspace && dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj -f net10.0 --filter 'FullyQualifiedName~Trust' --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=trust-infra-debian.trx' --results-directory /workspace/test-results && \
             dotnet test src/Ashlar.Tests.BackgroundAgents/Ashlar.Tests.BackgroundAgents.csproj -f net10.0 --filter 'FullyQualifiedName~Trust' --logger 'console;verbosity=minimal' --logger 'trx;LogFileName=trust-bg-debian.trx' --results-directory /workspace/test-results"
          bash scripts/ci/zero-test-guard.sh test-results/trust/trust-infra-debian.trx test-results/trust/trust-bg-debian.trx
      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: test-results/trust/**/*.trx
          check_name: Trust Tests - Debian
          comment_mode: off
          report_individual_runs: true
