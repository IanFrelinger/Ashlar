name: gRPC transport gate

on:
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/grpc-transport-gate.yml"
      - "src/Ashlar.Tests.Transport/**"
      - "src/Ashlar.Transport.Grpc/**"
      - "src/Ashlar.Abstractions/**"
  workflow_dispatch:

jobs:
  grpc-transport:
    name: gRPC agent transport (Kestrel integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Test Transport (ProdStyle)
        shell: bash
        run: |
          set -euo pipefail
          dotnet test src/Ashlar.Tests.Transport/Ashlar.Tests.Transport.csproj \
            --filter "Category=ProdStyle" \
            --logger "trx;LogFileName=transport-prodstyle.trx" --results-directory test-results \
            --blame-hang-timeout 120s
          bash scripts/ci/zero-test-guard.sh test-results/transport-prodstyle.trx
