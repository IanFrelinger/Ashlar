# Controller branch only. Replace e4bdeb46374cc7c6aaf8d6c9ebbb73f6fe10254a and green-plan.json after committing tests/fix.
name: Decision478 exact SHA proof 20261112
on:
  push:
    branches: [codex/decision478-proof-20261112]
    paths:
      - '.github/workflows/decision478-exact-sha-20261112.yml'
      - 'ci-decision478/**'
permissions:
  contents: read
concurrency:
  group: ashlar-hardening478-480-serial
  cancel-in-progress: false
jobs:
  exact-sha:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout controller
        uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: false
      - name: Checkout exact tested source
        uses: actions/checkout@v7
        with:
          ref: e4bdeb46374cc7c6aaf8d6c9ebbb73f6fe10254a
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Run serial test plan through Linux devtest
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/decision478
        run: |
          set -euo pipefail
          bash control/ci-decision478/run-host.sh source "$EVIDENCE_ROOT" control/ci-decision478/green-plan.json
      - name: Retain complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision478-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/decision478
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
