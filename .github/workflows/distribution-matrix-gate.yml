# Validates multiple consumer/distribution channels in parallel.
# See docs/DistributionModels.md for the mapping.
name: Distribution Matrix Gate

on:
  workflow_dispatch:
  schedule:
    # Weekly full matrix on default branch (path filters on PRs may skip jobs).
    - cron: "0 10 * * 1"
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/distribution-matrix-gate.yml"
      - "scripts/ci/distribution-matrix-api-http-smoke.sh"
      - ".docker/Dockerfile.api"
      - ".docker/Dockerfile.cli"
      - "scripts/verify-stable-sdk-host-sample-packages.sh"
      - "scripts/verify-standalone-brick-authoring.sh"
      - "scripts/verify-external-product-shape.sh"
      - "consumer-template/host/**"
      - "scripts/pack-ashlar-hosting-graph.sh"
      - "scripts/pack-ashlar-hosting-graph.ps1"
      - "scripts/pack-ashlar-hosting-graph.allowlist.txt"
      - "scripts/verify-pack-ashlar-hosting-graph-alignment.py"
      - "application/src/Ashlar.API/**"
      - "application/src/Ashlar.CLI/**"
      - "src/Ashlar.Client/**"
      - "src/Ashlar.Sdk/**"
      - "src/Ashlar.Hosting.Bundle/**"
      - "src/Ashlar.Authoring/**"
      - "src/Ashlar.Brick.Contracts/**"
      - "src/Ashlar.Core.Domain/Bricks/**"
      - "src/Ashlar.Core.Domain/Execution/**"
      - "src/Ashlar.Core.Application/**"
      - "src/Ashlar.Hosting/**"
      - "docs/samples/StableSdkHostSample/**"
      - "samples/templates/brick/**"
      - "samples/hello-brick/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/VirtualProduction/**"
      - "src/Ashlar.Tests.Infrastructure/Helpers/VirtualProduction/**"
      # The RID-publish stage measures the PACKED dependency graph, so the two library csprojs that
      # carry native payloads (and the version file behind them) are gate input even though no
      # consumer names them: NETSDK1152 shipped because an edit here could not trigger this job.
      - "src/Ashlar.Infrastructure/Ashlar.Infrastructure.csproj"
      - "src/Ashlar.AI.Pipeline/Ashlar.AI.Pipeline.csproj"
      - "Directory.Packages.props"
  pull_request:
    paths:
      - ".github/workflows/distribution-matrix-gate.yml"
      - "scripts/ci/distribution-matrix-api-http-smoke.sh"
      - ".docker/Dockerfile.api"
      - ".docker/Dockerfile.cli"
      - "scripts/verify-stable-sdk-host-sample-packages.sh"
      - "scripts/verify-standalone-brick-authoring.sh"
      - "scripts/verify-external-product-shape.sh"
      - "consumer-template/host/**"
      - "scripts/pack-ashlar-hosting-graph.sh"
      - "scripts/pack-ashlar-hosting-graph.ps1"
      - "scripts/pack-ashlar-hosting-graph.allowlist.txt"
      - "scripts/verify-pack-ashlar-hosting-graph-alignment.py"
      - "application/src/Ashlar.API/**"
      - "application/src/Ashlar.CLI/**"
      - "src/Ashlar.Client/**"
      - "src/Ashlar.Sdk/**"
      - "src/Ashlar.Hosting.Bundle/**"
      - "src/Ashlar.Authoring/**"
      - "src/Ashlar.Brick.Contracts/**"
      - "src/Ashlar.Core.Domain/Bricks/**"
      - "src/Ashlar.Core.Domain/Execution/**"
      - "src/Ashlar.Core.Application/**"
      - "src/Ashlar.Hosting/**"
      - "docs/samples/StableSdkHostSample/**"
      - "samples/templates/brick/**"
      - "samples/hello-brick/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/VirtualProduction/**"
      - "src/Ashlar.Tests.Infrastructure/Helpers/VirtualProduction/**"
      # The RID-publish stage measures the PACKED dependency graph, so the two library csprojs that
      # carry native payloads (and the version file behind them) are gate input even though no
      # consumer names them: NETSDK1152 shipped because an edit here could not trigger this job.
      - "src/Ashlar.Infrastructure/Ashlar.Infrastructure.csproj"
      - "src/Ashlar.AI.Pipeline/Ashlar.AI.Pipeline.csproj"
      - "Directory.Packages.props"

permissions:
  contents: read

concurrency:
  group: distribution-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuget-local-pack-consumer:
    name: NuGet local pack → StableSdkHostSample
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify package-consumer build (isolated cache)
        env:
          ASHLAR_SDK_PACKAGE_VERSION: "9.9.9-ci-${{ github.run_id }}"
        run: bash scripts/verify-stable-sdk-host-sample-packages.sh

  cli-image-smoke:
    name: CLI image build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build CLI image
        run: |
          docker build \
            --file .docker/Dockerfile.cli \
            --tag ashlar-cli:dist-matrix \
            .

      - name: Smoke (--help)
        run: docker run --rm ashlar-cli:dist-matrix --help

      # doctor --json expects git/curl and a dev-style host; the CLI image is aspnet runtime-only.
      - name: Smoke (pipeline validate --help)
        run: docker run --rm ashlar-cli:dist-matrix pipeline validate --help

  standalone-brick-authoring:
    name: Standalone brick authoring scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify tool-installed ashlar new brick outside repo
        run: bash scripts/verify-standalone-brick-authoring.sh

  external-product-shape:
    name: External product shape (brick + host + client)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify packed feed consumer (authored brick + thin host + HTTP client)
        env:
          ASHLAR_EXTERNAL_PRODUCT_VERIFY_VERSION: "9.9.9-ci-${{ github.run_id }}"
        run: bash scripts/verify-external-product-shape.sh

  api-image-http-smoke:
    name: API image + curl /health + /api/status
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build, run API, curl smoke
        run: bash scripts/ci/distribution-matrix-api-http-smoke.sh

  ashlar-client-inprocess-test:
    name: Ashlar.Client ↔ in-process Ashlar.API (net10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: dotnet test (VirtualProduction IAshlarClient)
        env:
          ASHLAR_ALLOW_MOCK: "1"
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            -f net10.0 \
            --filter "FullyQualifiedName~Ashlar.Tests.Infrastructure.Tests.VirtualProduction.FrameworkVirtualProdDemosTests.Virtual_prod_IAshlarClient_GetStatusAsync_matches_console_and_blazor_demos" \
            --verbosity minimal

  pack-hosting-graph-alignment:
    name: Pack script vs Ashlar.Hosting graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: verify-pack-ashlar-hosting-graph-alignment
        run: python3 scripts/verify-pack-ashlar-hosting-graph-alignment.py
