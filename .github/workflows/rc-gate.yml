# Release candidate gate — local stack + GitHub workflow verification.
# See docs/production-readiness/RCHardeningPlan-v1.md
name: RC Gate

on:
  schedule:
    # Monthly RC evidence on master (Phase 5 pivot); failures notify via GitHub Actions.
    - cron: "0 6 1 * *"
  push:
    branches: [master, main]
    paths:
      - "docs/production-readiness/RCHardeningPlan-v1.md"
      - "scripts/rc-gate*.sh"
      - ".github/workflows/rc-gate.yml"
  workflow_dispatch:
    inputs:
      tier:
        description: "Gate tier (a = multi-hour ashlar-ready meta-gate; full = a+b+c+d)"
        required: false
        default: "c"
        type: choice
        options:
          - a
          - b
          - c
          - d
          - full
      trigger_gh:
        description: "Dispatch missing GitHub workflows"
        required: false
        default: false
        type: boolean

jobs:
  rc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          # check-version-staleness.sh compares VERSION to the newest v* tag. A shallow
          # checkout truncates the history, git describe then finds no tag, and the check
          # silently measures nothing. Full depth plus tags or it is decorative.
          fetch-depth: 0
          fetch-tags: true

      - name: VERSION staleness (advisory)
        shell: bash
        run: bash scripts/check-version-staleness.sh

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Tier A (ashlar-ready)
        if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'a' || inputs.tier == 'full')
        run: make rc-gate-tier-a
        env:
          ASHLAR_ALLOW_MOCK: "1"
          RC_GATE_SKIP_DOCKER: "1"

      - name: Tier B (ship + release bundle)
        if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'b' || inputs.tier == 'full')
        run: make rc-gate-tier-b
        env:
          ASHLAR_ALLOW_MOCK: "1"

      - name: Tier C (evidence)
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.tier == 'c' || inputs.tier == 'full'))
        run: make rc-gate-tier-c

      - name: Tier D (GitHub workflows)
        if: github.event_name == 'workflow_dispatch' && (inputs.tier == 'd' || inputs.tier == 'full')
        env:
          RC_GATE_TRIGGER_GH: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_gh && '1' || '0' }}
          RC_GATE_GH_BRANCH: ${{ github.ref_name }}
        run: make rc-gate-tier-d

      - name: Upload RC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-gate-reports
          path: .ashlar/rc-gate/**
          if-no-files-found: ignore
          retention-days: 30
