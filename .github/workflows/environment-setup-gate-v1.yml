name: Environment Setup Gate v1

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "scripts/setup/**"
      - "application/src/Ashlar.CLI/**"
      - ".github/workflows/environment-setup-gate-v1.yml"

jobs:
  setup-gate:
    name: Setup gate - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.403
            8.0.427

      - name: Run setup check (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/setup/setup.sh check

      - name: Run setup restore (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash scripts/setup/setup.sh restore

      - name: Run setup check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup/setup.ps1 -Mode check

      - name: Run setup restore (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup/setup.ps1 -Mode restore

      - name: Setup matrix verifier (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup/verify-setup-matrix.ps1 -SkipDockerBuild -SkipDocker

      - name: Post-restore verification
        shell: bash
        run: |
          dotnet --info
          dotnet build application/src/Ashlar.CLI/Ashlar.CLI.csproj --no-restore -v minimal

      - name: Emit setup gate summary
        if: always()
        shell: bash
        run: |
          SUMMARY_FILE="${RUNNER_TEMP}/setup-gate-summary-${{ matrix.os }}.txt"
          {
            echo "environment-setup-gate-v1 summary"
            echo "runner_os=${{ runner.os }}"
            echo "matrix_os=${{ matrix.os }}"
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "status=completed"
          } > "${SUMMARY_FILE}"

      - name: Upload setup gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-setup-gate-v1-artifacts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/setup-gate-summary-${{ matrix.os }}.txt
          retention-days: 14

  setup-gate-ephemeral-linux:
    name: Setup gate (ephemeral container) - ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # sdk:10.0 has no Debian "-bookworm-slim" variant on MCR; the second distro is Ubuntu (noble).
          - image: mcr.microsoft.com/dotnet/sdk:10.0
            image_id: dotnet-sdk-10-0
          - image: mcr.microsoft.com/dotnet/sdk:10.0-noble
            image_id: dotnet-sdk-10-0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Docker availability
        shell: bash
        run: |
          docker --version

      - name: Run setup scripts in ephemeral container
        shell: bash
        run: |
          docker pull "${{ matrix.image }}"
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update
                apt-get install -y ca-certificates curl git gnupg bash
              fi
              bash scripts/setup/setup-linux.sh check
              bash scripts/setup/setup-linux.sh restore
              dotnet build application/src/Ashlar.CLI/Ashlar.CLI.csproj --no-restore -v minimal
            '

      - name: Emit ephemeral setup summary
        if: always()
        shell: bash
        run: |
          SUMMARY_FILE="${RUNNER_TEMP}/setup-gate-ephemeral-summary-${{ matrix.image_id }}.txt"
          {
            echo "environment-setup-gate-v1 ephemeral summary"
            echo "container_image=${{ matrix.image }}"
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "status=completed"
          } > "${SUMMARY_FILE}"

      - name: Upload ephemeral setup artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-setup-gate-v1-ephemeral-${{ matrix.image_id }}
          path: |
            ${{ runner.temp }}/setup-gate-ephemeral-summary-${{ matrix.image_id }}.txt
          retention-days: 14
