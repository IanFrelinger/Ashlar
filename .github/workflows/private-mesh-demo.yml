name: Private mesh demo

# Builds the node image from this commit and runs scripts/demo/private-mesh-demo.sh: three nodes share one
# signed package over HTTP. A node that trusts the sealer holds it for approval, a stranger refuses it, and
# a copy edited after sealing fails verification. Advisory, not a required check.
# Walkthrough: docs/PrivateMeshDemo.md.
on:
  pull_request:
    paths:
      - "scripts/demo/private-mesh-demo.sh"
      - "deploy/compose/docker-compose.private-mesh-demo.yml"
      - ".docker/Dockerfile.cli"
      - ".docker/node-entrypoint.sh"
      - "application/src/Ashlar.CLI/Commands/BackgroundAgent/**"
      - "application/src/Ashlar.CLI/Commands/PackageImport.cs"
      - "application/src/Ashlar.CLI/Commands/PkgCommand.cs"
      - "application/src/Ashlar.CLI/Commands/GatesCommand.cs"
      - "application/src/Ashlar.CLI/Commands/KeysCommand.cs"
      - "src/Ashlar.Manifest/**"
      - ".github/workflows/private-mesh-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-mesh-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: three nodes share a signed package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the node image from this commit
        shell: bash
        run: docker build --file .docker/Dockerfile.cli --tag ashlar-cli:demo .

      - name: Run the demo
        shell: bash
        env:
          ASHLAR_IMAGE: ashlar-cli:demo
        run: bash scripts/demo/private-mesh-demo.sh
