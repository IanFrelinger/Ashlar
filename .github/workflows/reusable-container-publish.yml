# Reusable: build and push nexo-cli + nexo-api to GHCR.
# Called from release.yml (tags / manual) or container-image-publish.yml (manual dispatch).
#
# Tag layout per image:
#   sha-<12>  immutable, pushed on every run and smoke-tested before anything else is tagged
#   latest    master/main only, rebuilt (nexo-cli: linux/amd64 + linux/arm64 unless skip_multi_arch)
#   X.Y.Z     v* tags only; a manifest retag of the smoke-tested sha-<12> digest, never a rebuild,
#             so it resolves to exactly the bytes that passed smoke (nexo-cli's sha tag is built
#             multi-arch on v* tags so the semver tag covers the same platforms as :latest)
#
# ARCHITECTURES DIFFER BETWEEN THE TWO IMAGES. nexo-cli is built for linux/amd64 + linux/arm64 on
# master and v* tags; nexo-api is built linux/amd64 only, on every path. skip_multi_arch below names
# nexo-cli for that reason - it does not reach publish-api, which hard-codes its --platform. A
# consumer pulling nexo-api onto an arm64 node gets "no matching manifest for linux/arm64".

on:
  workflow_call:
    inputs:
      skip_multi_arch:
        description: "When true, publish nexo-cli :latest (main) and :X.Y.Z (tags) as amd64 only"
        type: boolean
        required: false
        default: false
    outputs:
      cli_sha_tag:
        description: "Immutable GHCR tag for nexo-cli (sha-...)"
        value: ${{ jobs.publish-cli.outputs.cli_sha_tag }}
      api_sha_tag:
        description: "Immutable GHCR tag for nexo-api (sha-...)"
        value: ${{ jobs.publish-api.outputs.api_sha_tag }}

permissions:
  contents: read
  packages: write

concurrency:
  group: container-publish-reusable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-cli:
    name: GHCR nexo-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      cli_sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/nexo-cli"
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "SHA_TAG=${SHA_TAG}" >> "${GITHUB_ENV}"
          # The sha tag is the only IMMUTABLE reference this workflow publishes. :latest is
          # republished on every master push, and its previous manifest becomes untagged and
          # GC-eligible — so if the sha tag is amd64-only, there is NO digest that is both
          # multi-arch and permanent. An arm64 node then has nothing it can pin: pin the sha
          # digest and it fails "no matching manifest for linux/arm64"; pin the :latest index
          # digest and it 404s after a few merges. Hence arm64 on master as well as on v* tags.
          #
          # This costs almost nothing: the "Publish latest (amd64 + arm64) on main" step below
          # already builds arm64 on every master push, so widening here only moves when those
          # layers are built — buildx serves the later step from cache.
          SHA_PLATFORMS="linux/amd64"
          if [[ "${{ inputs.skip_multi_arch }}" != "true" ]]; then
            case "${GITHUB_REF}" in
              refs/tags/v*|refs/heads/master|refs/heads/main)
                SHA_PLATFORMS="linux/amd64,linux/arm64"
                ;;
            esac
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            echo "SEMVER_TAG=${IMAGE}:${SEMVER}" >> "${GITHUB_ENV}"
          else
            echo "SEMVER_TAG=" >> "${GITHUB_ENV}"
          fi
          echo "SHA_PLATFORMS=${SHA_PLATFORMS}" >> "${GITHUB_ENV}"

      - name: Build and push immutable sha tag (+ arm64 on master and release tags)
        timeout-minutes: 35
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --build-arg IMAGE_BUILD_EPOCH="$(date -u +%s)" \
            --platform "${SHA_PLATFORMS}" \
            --tag "${SHA_TAG}" \
            --push \
            .

      - name: Smoke test published image
        shell: bash
        run: |
          docker run --rm "${SHA_TAG}" --help

      - name: Publish latest (amd64 + arm64) on main
        if: >-
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
          && inputs.skip_multi_arch == false
        timeout-minutes: 35
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --build-arg IMAGE_BUILD_EPOCH="$(date -u +%s)" \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Publish latest (amd64 only) when multi-arch skipped
        if: >-
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
          && inputs.skip_multi_arch == true
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.cli \
            --build-arg IMAGE_BUILD_EPOCH="$(date -u +%s)" \
            --platform linux/amd64 \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Tag semver on release tag (retag smoke-tested sha digest)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          docker buildx imagetools create --tag "${SEMVER_TAG}" "${SHA_TAG}"
          docker buildx imagetools inspect "${SEMVER_TAG}"

  # amd64 only: both build steps below pass --platform linux/amd64 and nothing here reads
  # skip_multi_arch. See the architecture note in this file's header before changing either.
  publish-api:
    name: GHCR nexo-api
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      api_sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER_LC}/nexo-api"
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          echo "SHA_TAG=${SHA_TAG}" >> "${GITHUB_ENV}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF_NAME#v}"
            echo "SEMVER_TAG=${IMAGE}:${SEMVER}" >> "${GITHUB_ENV}"
          else
            echo "SEMVER_TAG=" >> "${GITHUB_ENV}"
          fi

      - name: Build and push linux/amd64 (immutable sha tag)
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.api \
            --platform linux/amd64 \
            --tag "${SHA_TAG}" \
            --push \
            .

      - name: Smoke test published API image (/health)
        shell: bash
        run: |
          cid="$(docker run -d -p 127.0.0.1:18081:8080 "${SHA_TAG}")"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18081/health" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish latest on main
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker buildx build \
            --file .docker/Dockerfile.api \
            --platform linux/amd64 \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Tag semver on release tag (retag smoke-tested sha digest)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          docker buildx imagetools create --tag "${SEMVER_TAG}" "${SHA_TAG}"
          docker buildx imagetools inspect "${SEMVER_TAG}"
