# Enforces separation between kernel/runtime (`src/`) and application (`application/`).
#
# Enable required check: Settings → Rules → require status check "layer-boundary / verify".
# See docs/contributing/Branch-layer-rules.md
name: layer-boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "**"

concurrency:
  group: layer-boundary-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce layer rules
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::Missing PR base or head SHA."
            exit 1
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          echo "Base: $BASE_REF  Head: $HEAD_REF"
          echo "Changed files:"
          echo "$CHANGED"

          COMMERCIAL_INTEGRATION=0
          if echo "$CHANGED" | grep -q '^commercial/'; then
            COMMERCIAL_INTEGRATION=1
            echo "Commercial paths changed — allowing coordinated application/ + src/ integration merges."
          fi

          # --- Explicit coordinated integration (application/* branch -> master) ---
          # The hatches above assumed integration merges always ride commercial work; a PURE
          # application-layer integration (e.g. landing an application/* integration branch's
          # accumulated verbs onto master) had no legal path. This token is that path, made
          # explicit and auditable: the PR body must carry [coordinated-integration] plus a
          # rationale humans can review. Mirrors the [skip-prod-style] convention in the
          # testing-strategy gate.
          #
          # LEGITIMATE USE CASES (require [coordinated-integration] token + justification):
          #   * application/src/Ashlar.CLI consumes new src/ kernel feature
          #     Example: CLI VerifyCommand adds --read-only flag using new ProjectVerifier.Verify(..., readOnly) API
          #   * application/src/Ashlar.API adds endpoint for new src/ use case
          #     Example: API endpoint wraps new Ashlar.Core.Application port
          #   * application/* integration branches land accumulated work onto master
          #     Example: accumulated CLI/API features from a feature branch merge to master
          #
          # The exemption requires PR body justification because it crosses the architectural
          # boundary deliberately; reviewers must affirm the integration is intentional and
          # that src/ code remains reusable (no application-layer logic pulled down into kernel).
          COORDINATED_INTEGRATION=0
          if [[ "${PR_BODY:-}" == *"[coordinated-integration]"* ]]; then
            COORDINATED_INTEGRATION=1
            echo "::notice::[coordinated-integration] declared in the PR body — allowing application/ paths into '$BASE_REF'. Reviewers: the PR body must justify this."
          fi

          DISTRIBUTION_AUTHORING=0
          if echo "$CHANGED" | grep -q '^application/' && \
             { echo "$CHANGED" | grep -q '^src/Ashlar.Authoring/' || \
               echo "$CHANGED" | grep -q '^scripts/verify-standalone-brick-authoring.sh'; }; then
            DISTRIBUTION_AUTHORING=1
            echo "Ashlar.Authoring distribution paths changed — allowing coordinated application/ + src/ integration merge."
          fi

          # --- Forced cleanup after a kernel project is deleted ---
          # Retiring a src/ project makes application/ csproj files that reference it
          # unbuildable, so the reference MUST come out in the same PR. That is a
          # mechanical consequence of a kernel change, not an application change.
          #
          # Deliberately hostile to everything else. To qualify, EVERY changed
          # application/ path must satisfy all of:
          #   * the file is a .csproj
          #   * the diff adds NO lines at all (pure removal)
          #   * every removed line is a <ProjectReference ... Include="...src/...csproj">
          #   * that reference's target no longer exists on the head commit
          # So an application .cs edit, an added PackageReference, a removed
          # ProjectReference whose target still exists, or any other removed line
          # all fail and the guard still rejects the PR.
          FORCED_KERNEL_CLEANUP=0
          APP_CHANGED=$(echo "$CHANGED" | grep '^application/' || true)
          if [ -n "$APP_CHANGED" ]; then
            QUALIFIES=1
            REMOVED_FILE=$(mktemp)
            for f in $APP_CHANGED; do
              case "$f" in
                *.csproj) ;;
                *) QUALIFIES=0; break ;;
              esac

              # Any added line at all disqualifies: this exemption is for pure removal.
              if git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$f" \
                   | grep -E '^\+' | grep -vE '^\+\+\+' | grep -q .; then
                QUALIFIES=0; break
              fi

              git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$f" \
                | grep -E '^-' | grep -vE '^---' > "$REMOVED_FILE" || true

              while IFS= read -r line; do
                [ -z "$line" ] && continue
                case "$line" in
                  *"<ProjectReference"*Include=*.csproj*) ;;
                  *) QUALIFIES=0; break ;;
                esac
                TARGET=$(printf '%s' "$line" | sed -n 's/.*Include="\([^"]*\)".*/\1/p' | tr '\134' '/')
                case "$TARGET" in
                  */src/*|src/*) ;;
                  *) QUALIFIES=0; break ;;
                esac
                # The reference must be dangling on the head commit — if the target
                # still exists this is an ordinary application edit, not forced cleanup.
                RESOLVED=$(realpath -m "$(dirname "$f")/$TARGET" 2>/dev/null || true)
                if [ -z "$RESOLVED" ] || [ -e "$RESOLVED" ]; then
                  QUALIFIES=0; break
                fi
              done < "$REMOVED_FILE"

              [ "$QUALIFIES" -eq 0 ] && break
            done
            rm -f "$REMOVED_FILE"
            if [ "$QUALIFIES" -eq 1 ]; then
              FORCED_KERNEL_CLEANUP=1
              echo "application/ diff is only removal of ProjectReference(s) to deleted src/ project(s) — allowing forced cleanup."
            fi
          fi

          # --- Test-only application changes ---
          # A kernel change often needs the application-side TEST suite updated in the
          # same PR. Those files ship nothing: they are not in any product artifact, so
          # they cannot violate the kernel/application layering this guard protects.
          #
          # Narrow by construction. EVERY changed application/ path must be owned by a
          # project that is genuinely a test project — determined by walking up to the
          # nearest .csproj and requiring Microsoft.NET.Test.Sdk in it, NOT by trusting
          # a directory name. A single changed application/ path that resolves to a
          # product project (or to no project at all) disqualifies the whole PR.
          TEST_ONLY_CHANGE=0
          if [ -n "$(echo "$CHANGED" | grep '^application/' || true)" ]; then
            TEST_ONLY=1
            for f in $(echo "$CHANGED" | grep '^application/' || true); do
              OWNER=""
              d=$(dirname "$f")
              while [ "$d" != "." ] && [ "$d" != "/" ]; do
                CANDIDATE=$(ls "$d"/*.csproj 2>/dev/null | head -1 || true)
                if [ -n "$CANDIDATE" ]; then OWNER="$CANDIDATE"; break; fi
                d=$(dirname "$d")
              done
              if [ -z "$OWNER" ] || ! grep -q "Microsoft.NET.Test.Sdk" "$OWNER"; then
                TEST_ONLY=0; break
              fi
            done
            if [ "$TEST_ONLY" -eq 1 ]; then
              TEST_ONLY_CHANGE=1
              echo "every changed application/ path belongs to a test project — allowing test-only change."
            fi
          fi

          # --- Runtime bases: no application/ (except coordinated integration merges) ---
          case "$BASE_REF" in
            master|main|runtime/*)
              if [[ "$COMMERCIAL_INTEGRATION" -eq 0 && "$DISTRIBUTION_AUTHORING" -eq 0 && "$FORCED_KERNEL_CLEANUP" -eq 0 && "$TEST_ONLY_CHANGE" -eq 0 && "$COORDINATED_INTEGRATION" -eq 0 ]] && echo "$CHANGED" | grep -q '^application/'; then
                echo "::error::Base branch '$BASE_REF' is runtime/kernel-first. This PR changes application/ — retarget or remove those paths."
                exit 1
              fi
              ;;
          esac

          # --- Application bases: no kernel src/ ---
          case "$BASE_REF" in
            application/*)
              if echo "$CHANGED" | grep -q '^src/'; then
                echo "::error::Base branch '$BASE_REF' is application-only. This PR changes src/ — open kernel changes against master/main instead."
                exit 1
              fi
              ;;
          esac

          # --- Branch naming: avoid application/* → runtime base ---
          case "$BASE_REF" in
            master|main|runtime/*)
              case "$HEAD_REF" in
                application/*)
                  echo "::error::Head branch '$HEAD_REF' is application-scoped; do not PR directly into '$BASE_REF'."
                  exit 1
                  ;;
              esac
              ;;
          esac

          # --- Branch naming: avoid runtime/* → application base ---
          case "$BASE_REF" in
            application/*)
              case "$HEAD_REF" in
                runtime/*)
                  echo "::error::Head branch '$HEAD_REF' is runtime-scoped; do not PR into application base '$BASE_REF'."
                  exit 1
                  ;;
              esac
              ;;
          esac

          echo "Layer boundary checks passed."
