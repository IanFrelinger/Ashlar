# DORMANT: manual-only since 2026-08-11 (push trigger commented out below); last 15 automatic runs
# were all red on the product assertion described under DISABLED. Kept because it is the only
# Windows/macOS matrix in the repo and because scope=playground / scope=persistence replaced the
# deleted runtime-studio-playground.yml and test-persistence-multi-os.yml (2026-08-16, PR ci/workflow-pruning).
#
# Cross-platform test server: one trigger runs build + test on Mac, Windows, and Linux.
# Use this when you want to run tests on all platforms without changing hosts.
# Trigger: Actions → Cross-Platform Tests → Run workflow, or: gh workflow run "Cross-Platform Tests"
name: Cross-Platform Tests
# DISABLED (automatic triggers only) — 2026-08-11.
#
# ⚠️  UNLIKE the other workflows muted alongside this one, this was NOT failing on
# infrastructure. It fails on a REAL product assertion, identically on Windows, macOS
# and Linux, on both net8.0 and net10.0 (net9.0 at the time of muting):
#
#   RuntimeStudioBlackBoxSmokeTests.Daemon_extender_claims_objective_from_store_increments_attempts
#   Assert.Contains() Failure: Sub-string not found   (19 of 20 passing)
#
# That failure is tracked in issue #252 and is now INVISIBLE in CI. This workflow was
# also the only cross-platform validation in the repo, so while it is muted there is no
# automated Windows or macOS coverage at all.
#
# Re-enable by uncommenting the push block below. workflow_dispatch stays live, so the
# failure can be reproduced from the Actions tab without reinstating the noise.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - playground
          - integration
          - persistence
          - trust
          - adaptation
          - e2e
          - dogfood
          - full
#  push:
#    branches: [ master, main ]
#    paths:
#      - '.github/workflows/cross-platform-tests.yml'
#      - 'src/Ashlar.Tests.Infrastructure/**'
#      - 'src/Ashlar.Tests.BackgroundAgents/**'
#      - 'src/Ashlar.Core.Application/**'
#      - 'src/Ashlar.Infrastructure/**'
#      - 'src/Ashlar.BackgroundAgents/**'
#      - 'application/src/Ashlar.CLI/**'
#      - 'src/Ashlar.Tests.Domain/**'
#      - 'src/Ashlar.Tests.Application/**'
#      - 'application/src/Ashlar.Tests.CLI/**'
#
jobs:
  cross-platform:
    name: Build & Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore Ashlar.sln

      - name: Build
        run: dotnet build Ashlar.sln --no-restore -v minimal

      - name: Run tests (smoke)
        if: github.event.inputs.scope != 'persistence' && github.event.inputs.scope != 'trust' && github.event.inputs.scope != 'full' && github.event.inputs.scope != 'integration' && github.event.inputs.scope != 'e2e' && github.event.inputs.scope != 'dogfood' && github.event.inputs.scope != 'adaptation' && github.event.inputs.scope != 'playground'
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 450s \
            --filter "(FullyQualifiedName~BaseFrameworkSmokeTests|FullyQualifiedName~RuntimeStudioBlackBoxSmokeTests)" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=smoke-${{ matrix.os }}.trx" \
            --results-directory test-results
          dotnet test src/Ashlar.Tests.BackgroundAgents/Ashlar.Tests.BackgroundAgents.csproj \
            --no-build \
            --blame-hang-timeout 60s \
            --filter "FullyQualifiedName~RuntimeStudioWhiteBoxSmokeTests" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=smoke-whitebox-${{ matrix.os }}.trx" \
            --results-directory test-results

      - name: Run tests (playground)
        if: github.event.inputs.scope == 'playground'
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 900s \
            --filter "Category=Playground" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=playground-infra-${{ matrix.os }}.trx" \
            --results-directory test-results
          dotnet test src/Ashlar.Tests.BackgroundAgents/Ashlar.Tests.BackgroundAgents.csproj \
            --no-build \
            --blame-hang-timeout 300s \
            --filter "Category=Playground" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=playground-bg-${{ matrix.os }}.trx" \
            --results-directory test-results

      - name: Run tests (dogfood)
        if: github.event.inputs.scope == 'dogfood'
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 180s \
            --filter "FullyQualifiedName~Dogfood" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=dogfood-${{ matrix.os }}.trx" \
            --results-directory test-results

      - name: Run tests (integration)
        if: github.event.inputs.scope == 'integration' || github.event.inputs.scope == 'full'
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 720s \
            --filter "Category=Integration" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=integration-${{ matrix.os }}.trx" \
            --results-directory test-results

      - name: Run tests (persistence)
        if: github.event.inputs.scope == 'persistence' || github.event.inputs.scope == 'full'
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 60s \
            --filter "FullyQualifiedName~InMemoryPersistenceTests" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=persistence-${{ matrix.os }}.trx" \
            --results-directory test-results

      - name: Run tests (e2e)
        if: github.event.inputs.scope == 'e2e' || github.event.inputs.scope == 'full'
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 900s \
            --filter "Category=E2E" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=e2e-${{ matrix.os }}.trx" \
            --results-directory test-results

      - name: Run tests (adaptation)
        if: github.event.inputs.scope == 'adaptation'
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 90s \
            --filter "Category=Adaptation" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=adaptation-${{ matrix.os }}.trx" \
            --results-directory test-results

      - name: Run tests (trust)
        if: github.event.inputs.scope == 'trust' || github.event.inputs.scope == 'full'
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 180s \
            --filter "FullyQualifiedName~Trust" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=trust-infra-${{ matrix.os }}.trx" \
            --results-directory test-results
          dotnet test src/Ashlar.Tests.BackgroundAgents/Ashlar.Tests.BackgroundAgents.csproj \
            --no-build \
            --blame-hang-timeout 60s \
            --filter "FullyQualifiedName~Trust" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=trust-bg-${{ matrix.os }}.trx" \
            --results-directory test-results

      - name: Run tests (full Infrastructure)
        if: github.event.inputs.scope == 'full'
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            --no-build \
            --blame-hang-timeout 900s \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=full-${{ matrix.os }}.trx" \
            --results-directory test-results

      - name: Publish test results
        if: always() && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.trx
          check_name: Cross-Platform - ${{ matrix.os }}
          report_individual_runs: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 14
