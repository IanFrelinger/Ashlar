name: Import integrity exact-source validation
on:
  push:
    branches: ['probe/import-integrity']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'd9ca9892b739fd40fa56e6f4a7eb569cb00bcff4'
          fetch-depth: 0
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = 'd9ca9892b739fd40fa56e6f4a7eb569cb00bcff4'
          test "$(git rev-parse HEAD^{tree})" = '61445e871a3d88f6e89a522a92fa61545a324d0f'
      - name: Focused import and package suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/import-integrity"
          bash scripts/test-in-container.sh --project application/src/Ashlar.Tests.CLI/Ashlar.Tests.CLI.csproj --filter 'FullyQualifiedName~PackageImportIntegrityTests|FullyQualifiedName~PkgCommandTests|FullyQualifiedName~MeshAutoPullServiceTests|FullyQualifiedName~PackageDisplaySecurityTests' 2>&1 | tee "${RUNNER_TEMP}/import-integrity/focused.log"
      - name: Product loop end to end
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-in-container.sh -- 'bash scripts/e2e-loop.sh' 2>&1 | tee "${RUNNER_TEMP}/import-integrity/e2e.log"
      - name: Nine mutation proofs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-in-container.sh -- 'python3 scripts/run-spec007-mutation-batch.py --manifest scripts/mutations/import-integrity.json --archive-stdout' 2>&1 | tee "${RUNNER_TEMP}/import-integrity/mutations.log"
      - name: Decode mutation evidence
        if: always()
        shell: bash
        run: |
          if [ -f "${RUNNER_TEMP}/import-integrity/mutations.log" ]; then
            python3 scripts/decode-spec007-mutation-evidence.py --log "${RUNNER_TEMP}/import-integrity/mutations.log" --output "${RUNNER_TEMP}/import-integrity/mutation-evidence" --repo .
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-integrity-d9ca9892b739fd40fa56e6f4a7eb569cb00bcff4
          path: ${{ runner.temp }}/import-integrity
          if-no-files-found: error
