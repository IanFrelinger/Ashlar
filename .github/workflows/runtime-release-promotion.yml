# DORMANT: manual-only; the schedule was removed after repeated failures and the last run
# (2026-05-11) was red — 11 of the last 14 runs failed, none since. Kept (not deleted) because
# scripts/rc-gate-tier-d.sh lists "Runtime Release Promotion" as an optional RC signal.
# 2026-08-16, PR ci/workflow-pruning.
name: Runtime Release Promotion

on:
  workflow_dispatch:

jobs:
  release-promotion-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Restore
        run: |
          dotnet restore application/src/Ashlar.CLI/Ashlar.CLI.csproj
          dotnet restore src/Ashlar.Tests.Infrastructure/scripts/copy-assemblies.csproj

      - name: Build CLI
        run: dotnet build application/src/Ashlar.CLI/Ashlar.CLI.csproj --no-restore -v minimal

      - name: Core promotion gate (strict)
        run: dotnet run --project application/src/Ashlar.CLI -- runtime release-gate --repo-root . --mode core --lane-repetitions 3 --core-min-pass-rate 0.9 --core-min-total 9 --core-history-window 9

      - name: Upload core promotion SLO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-release-promotion-core-evidence
          path: |
            .ashlar/runtime/release-gate/last-run/evidence.json
            .ashlar/runtime/release-gate/last-run/evidence.md
          if-no-files-found: warn

  release-promotion-visual-strict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Restore
        run: |
          dotnet restore application/src/Ashlar.CLI/Ashlar.CLI.csproj
          dotnet restore src/Ashlar.Tests.Infrastructure/scripts/copy-assemblies.csproj

      - name: Build CLI
        run: dotnet build application/src/Ashlar.CLI/Ashlar.CLI.csproj --no-restore -v minimal

      - name: Visual promotion gate (strict, advisory until infra ready)
        run: dotnet run --project application/src/Ashlar.CLI -- runtime release-gate --repo-root . --mode visual --lane-repetitions 3 --visual-required-mode true --visual-min-pass-rate 0.85 --visual-min-total 9 --visual-history-window 9 --visual-promotion-streak 3

      - name: Upload visual promotion SLO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-release-promotion-visual-evidence
          path: |
            .ashlar/runtime/release-gate/last-run/evidence.json
            .ashlar/runtime/release-gate/last-run/evidence.md
          if-no-files-found: warn

  release-promotion-chaos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - name: Restore
        run: |
          dotnet restore application/src/Ashlar.CLI/Ashlar.CLI.csproj
          dotnet restore src/Ashlar.Tests.Infrastructure/scripts/copy-assemblies.csproj

      - name: Build CLI
        run: dotnet build application/src/Ashlar.CLI/Ashlar.CLI.csproj --no-restore -v minimal

      - name: Chaos observation lane
        run: dotnet run --project application/src/Ashlar.CLI -- runtime release-gate --repo-root . --mode chaos

      - name: Upload chaos promotion SLO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-release-promotion-chaos-evidence
          path: |
            .ashlar/runtime/release-gate/last-run/evidence.json
            .ashlar/runtime/release-gate/last-run/evidence.md
          if-no-files-found: warn
