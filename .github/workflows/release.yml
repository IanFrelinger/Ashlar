# One entry point: GHCR images + NuGet for a release.
#
# - Push tag v*.*.* → images from tag commit + NuGet version from tag name
# - workflow_dispatch → images from current ref + NuGet version you enter
#
# NuGet Trusted Publishing: register workflow file **release.yml** on nuget.org.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet semver (e.g. 1.2.3) — for dispatch from a branch; use tag push for aligned releases"
        required: true
        type: string
      skip_multi_arch:
        description: "Skip arm64 for ashlar-cli :latest (master/main) and :X.Y.Z (tags)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release inputs
    # Forks: every downstream job needs validate to succeed, so this one guard keeps a fork's
    # tag push from publishing images/packages under its own namespace (docs/CiSecrets.md).
    if: github.repository_owner == 'IanFrelinger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Verify global.json SDK pin matches installed SDKs
        shell: bash
        run: bash scripts/verify-release-sdk-pin.sh

      # Directory.Build.props/.targets stamp every assembly and package from the root VERSION file,
      # while the nuget job below takes package_version from the tag name. Without this guard a tag
      # cut before VERSION was bumped ships nupkgs whose PackageVersion disagrees with their assemblies.
      - name: Tag version must match root VERSION
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # shellcheck source=scripts/lib/release-staging-guards.sh
          source scripts/lib/release-staging-guards.sh
          if ! assert_version_matches_canonical "${GITHUB_REF_NAME}"; then
            CANON="$(bash scripts/resolve-canonical-package-version.sh || true)"
            echo "::error::Tag ${GITHUB_REF_NAME} does not match root VERSION (${CANON:-<unreadable>}). Bump VERSION (and CHANGELOG.md) on the release commit, then re-create the tag on it."
            exit 1
          fi

      - name: Dispatch on tag must match version input
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IN="${IN_VERSION#v}"
          if [ "$TAG" != "$IN" ]; then
            echo "::error::When running Release from workflow_dispatch on tag ${GITHUB_REF_NAME}, input version must be **${TAG}** (you entered **${IN}**)."
            exit 1
          fi
          echo "OK: version input matches tag."

      # THE CASE THE TWO GUARDS ABOVE BOTH MISS: workflow_dispatch from a BRANCH.
      #
      # The first is `if: github.ref_type == 'tag'`. The second is `if: workflow_dispatch AND
      # startsWith(github.ref, 'refs/tags/')`. Dispatch from a branch satisfies neither, and that
      # path publishes to nuget.org. Directory.Build.targets stamps Version/AssemblyVersion/
      # FileVersion from the root VERSION file, while the nuget job takes package_version from the
      # input - `-p:PackageVersion=` is a global property that overrides PackageVersion and NOT
      # Version - so an unguarded dispatch ships nupkgs whose package version disagrees with the
      # assemblies inside them. That is the same defect the tag guard exists to prevent, on the
      # trigger nobody guarded.
      #
      # A prerelease of the canonical version is allowed, because cutting 0.2.0-rc1 from a branch
      # while VERSION reads 0.2.0 is the staging flow this input was added for. What is refused is a
      # DIFFERENT release: 0.9.9 while VERSION says 0.2.0.
      - name: Dispatch from a branch must match root VERSION
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/release-staging-guards.sh
          source scripts/lib/release-staging-guards.sh
          if ! assert_dispatch_version_allowed "${IN_VERSION}"; then
            echo "::error::Dispatching ${IN_VERSION} from ${GITHUB_REF_NAME} would publish packages whose version disagrees with their assemblies. See the ABORT lines above."
            exit 1
          fi

      # ci/published-version is what consumer-template/Directory.Packages.props and CONSUMING.md
      # pin strangers to. Nothing in the release path writes it, so after a release it still names
      # the PREVIOUS one and every copied consumer template installs a version behind - silently,
      # because the lint only checks the file is well-formed, not that it is current.
      #
      # It is enforced here rather than automated, for the same reason VERSION and CHANGELOG are:
      # the release commit is where a human decides what is being shipped, and a workflow that
      # rewrites the repo mid-publish is a bigger hazard than a guard that refuses.
      - name: Consumer pin (ci/published-version) must name this release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/release-staging-guards.sh
          source scripts/lib/release-staging-guards.sh
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            WANT="${GITHUB_REF_NAME}"
          else
            WANT="${IN_VERSION}"
          fi
          if ! assert_consumer_pin_matches "${WANT}"; then
            echo "::error::ci/published-version does not name this release; a stranger copying consumer-template would install the previous one. See the ABORT lines above."
            exit 1
          fi

  # Ordered AFTER nuget on purpose. GHCR tags can be re-pointed or deleted; nuget.org packages
  # can only be unlisted. Running the two in parallel let `:0.2.0` go permanent on one side
  # while the other failed - which is how v0.1.2 carried a semver image tag and a red NuGet job.
  images:
    name: Container images (GHCR)
    needs: [validate, nuget]
    if: needs.validate.result == 'success' && needs.nuget.result == 'success'
    uses: ./.github/workflows/reusable-container-publish.yml
    secrets: inherit
    with:
      skip_multi_arch: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_multi_arch || false }}

  nuget:
    name: NuGet packages
    needs: [validate]
    if: needs.validate.result == 'success'
    uses: ./.github/workflows/reusable-release-nuget.yml
    secrets: inherit
    with:
      package_version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

  # After packages are pushed to nuget.org, confirm an external-style restore works (indexing can lag).
  verify-nuget-consumer:
    name: Verify NuGet consumer (nuget.org)
    needs: [nuget]
    if: success() && (vars.NUGET_PUBLISH_MODE == 'oidc' || vars.NUGET_PUBLISH_MODE == 'apikey')
    uses: ./.github/workflows/reusable-verify-nuget-consumer.yml
    with:
      package_version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

  verify-published:
    name: Cross-check published GHCR images
    needs: [images, nuget]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Skip cross-verify (prior jobs failed or disabled)
        if: >-
          needs.images.result != 'success' || needs.nuget.result != 'success' ||
          vars.RELEASE_CROSS_VERIFY == 'false'
        run: |
          echo "Skipping GHCR re-pull smoke (images=${{ needs.images.result }} nuget=${{ needs.nuget.result }} RELEASE_CROSS_VERIFY=${{ vars.RELEASE_CROSS_VERIFY }})."

      - name: Checkout
        if: >-
          needs.images.result == 'success' && needs.nuget.result == 'success' &&
          vars.RELEASE_CROSS_VERIFY != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        if: >-
          needs.images.result == 'success' && needs.nuget.result == 'success' &&
          vars.RELEASE_CROSS_VERIFY != 'false'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke published images by digest tag
        if: >-
          needs.images.result == 'success' && needs.nuget.result == 'success' &&
          vars.RELEASE_CROSS_VERIFY != 'false'
        shell: bash
        env:
          RELEASE_SMOKE_CLI_IMAGE: ${{ needs.images.outputs.cli_sha_tag }}
          RELEASE_SMOKE_API_IMAGE: ${{ needs.images.outputs.api_sha_tag }}
        run: bash scripts/release-smoke-published-docker.sh

  summarize:
    name: Release summary
    needs: [validate, images, nuget, verify-published, verify-nuget-consumer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          OWNER_LC="${OWNER,,}"
          SHA12="${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          {
            echo "## Release"
            echo ""
            echo "| Item | Pin |"
            echo "|------|-----|"
            echo "| ashlar-cli | \`${{ needs.images.outputs.cli_sha_tag }}\` |"
            echo "| ashlar-api | \`${{ needs.images.outputs.api_sha_tag }}\` |"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "| semver (tags) | \`:${VER}\` |"
            fi
            echo "| NuGet | \`Ashlar.Hosting.Bundle\` **${VER}** (+ graph, Client, Sdk) |"
            echo ""
            echo "NuGet artifact: **nuget-packages-${VER}** (includes \`nuget-publish-manifest.json\` + per-package \`.sha256.txt\` when built from this workflow)."
            echo ""
            echo "| Validate | ${{ needs.validate.result }} |"
            echo "| Cross-verify | ${{ needs.verify-published.result }} |"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Draft GitHub Release
    needs: [validate, images, nuget]
    # always(), gated on publication having BEGUN rather than on everything having succeeded.
    # When a post-push check failed, `success()` skipped this job and the only copy of the
    # nupkgs and nuget-publish-manifest.json was a 90-day Actions artifact - for packages that
    # are permanent. That is how the v0.1.2 release page came to be assembled by hand. The
    # release is created as a DRAFT, so running here after a failure publishes nothing.
    if: >-
      always() &&
      github.ref_type == 'tag' &&
      vars.RELEASE_CREATE_GITHUB_RELEASE != 'false' &&
      needs.validate.result == 'success' &&
      needs.nuget.outputs.publish_began == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create or skip draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_RESULT: ${{ needs.nuget.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          CLI_SHA_TAG: ${{ needs.images.outputs.cli_sha_tag }}
          API_SHA_TAG: ${{ needs.images.outputs.api_sha_tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
            exit 0
          fi
          VER="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          SNIP="$(mktemp)"
          bash scripts/changelog-snippet-for-release.sh > "$SNIP" || true
          {
            if [ "${NUGET_RESULT}" != "success" ]; then
              echo "> **This release did not complete cleanly.** NuGet publication began, but the"
              echo "> nuget job ended \`${NUGET_RESULT}\` - see the run below. Packages may already be"
              echo "> public on nuget.org. Do NOT publish this draft until that is resolved."
              echo ""
            fi
            echo "Automated draft for **${TAG}**."
            echo ""
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- NuGet: \`Ashlar.Hosting.Bundle\` **${VER}** (+ graph). Packages, symbols, \`nuget-publish-manifest.json\` and per-package \`.sha256.txt\` are attached as release assets (also in the \`nuget-packages-${VER}\` workflow artifact)."
            if [ "${IMAGES_RESULT}" = "success" ]; then
              echo "- Images: \`${CLI_SHA_TAG}\`, \`${API_SHA_TAG}\`"
            else
              echo "- Images: **not published** (images job ended \`${IMAGES_RESULT}\`; it runs only after NuGet succeeds)."
            fi
            echo ""
            cat "$SNIP"
            echo ""
            echo "Edit notes and publish when ready. See \`docs/RELEASE.md\` and \`docs/SdkCompatibilityPolicy.md\`."
          } > "$NOTES_FILE"
          rm -f "$SNIP"
          gh release create "$TAG" --repo "${{ github.repository }}" --draft --title "Release ${TAG}" --notes-file "$NOTES_FILE"
          rm -f "$NOTES_FILE"

      # The nuget job keeps the packages only as a 90-day Actions artifact; the release page is the
      # durable home for them (and lets consumers verify bytes against the manifest without a run URL).
      - name: Download NuGet packages artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nuget-packages-${{ needs.nuget.outputs.package_version }}
          path: ${{ runner.temp }}/release-assets

      - name: Attach NuGet packages + manifest to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          FILES=()
          for f in "${ASSETS_DIR}"/*.nupkg "${ASSETS_DIR}"/*.snupkg "${ASSETS_DIR}"/*.sha256.txt "${ASSETS_DIR}"/nuget-publish-manifest.json; do
            [ -f "$f" ] && FILES+=( "$f" )
          done
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No release assets found under ${ASSETS_DIR} (artifact nuget-packages-${{ needs.nuget.outputs.package_version }} was empty?)."
            exit 1
          fi
          printf 'Uploading %d asset(s) to %s:\n' "${#FILES[@]}" "$TAG"
          printf '  %s\n' "${FILES[@]##*/}"
          gh release upload "$TAG" "${FILES[@]}" --repo "${{ github.repository }}" --clobber

  notify:
    name: Release notification
    needs: [validate, images, nuget, verify-published]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: POST workflow status
        shell: bash
        env:
          URL: ${{ secrets.RELEASE_NOTIFICATION_WEBHOOK_URL }}
        run: |
          if [ -z "${URL}" ]; then
            echo "No RELEASE_NOTIFICATION_WEBHOOK_URL secret; skip notify."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          STATUS="failure"
          if [ "${{ needs.validate.result }}" = "success" ] && [ "${{ needs.images.result }}" = "success" ] && [ "${{ needs.nuget.result }}" = "success" ]; then
            STATUS="success"
          fi
          PAYLOAD="$(jq -nc \
            --arg repo "${{ github.repository }}" \
            --arg ver "$VER" \
            --arg st "$STATUS" \
            --arg run "${{ github.run_id }}" \
            --arg html "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{repository:$repo, version:$ver, status:$st, run_id:$run, run_url:$html, workflow:"Release"}')"
          curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$URL" || echo "::warning::Webhook POST failed (non-fatal)"
