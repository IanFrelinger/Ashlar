name: Mesh lab TLS gate

# STATUS (recorded 2026-09-13): this weekly lane is RED and has not been triaged. Scheduled runs:
# four consecutive failures 2026-08-18, -25, 09-01, 09-08; ten of the last fourteen red; last green
# 2026-08-11. Its two siblings were both treated under this repository's own policy and this one was
# not: mesh-lab-gate.yml went manual-only 2026-08-11 after fifteen red automatic runs, and
# mesh-lab-stress-gate.yml had its weekly schedule removed 2026-08-16 after eight consecutive reds.
# Its last green run is the same week mesh-lab-gate went dormant, which is suggestive of the shared
# compose environment but is NOT verified here - the failing logs have not been read.
#
# The schedule is deliberately LEFT LIVE. Demoting a third mesh lane is a judgement about whether the
# mesh lab is still worth proving weekly, and that call belongs to the owner, not to the commit that
# noticed the streak. Either triage the failures or demote it the way the siblings were demoted; do
# not leave it silently red - that is docs/HowGatesGoQuiet.md section 1.

on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

jobs:
  mesh-lab-tls:
    name: Mesh lab HTTPS (Caddy → peer-a)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: ashlar_mesh_lab_tls_ci
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Docker
        shell: bash
        run: |
          set -euo pipefail
          docker compose version

      - name: Write lab env
        shell: bash
        run: |
          set -euo pipefail
          KEY="mesh-lab-tls-${GITHUB_RUN_ID}-${GITHUB_SHA}"
          KEY="${KEY:0:64}"
          {
            echo "Ashlar__Security__ApiKey=${KEY}"
            echo "Ashlar__Security__PeerB__BearerToken=${KEY}-bearer"
            echo "Ashlar__Security__Worker__BasicAuthPassword=${KEY}-basic"
            echo "MESH_LAB_PEER_REGISTRATION_KEY=${KEY}-peer-registration"
            echo "Ashlar__Mesh__Persistence__Provider=LiteDb"
            echo "MESH_LAB_PEER_A_PUBLISH=127.0.0.1:18081"
            echo "MESH_LAB_PEER_B_PUBLISH=127.0.0.1:18082"
            echo "MESH_LAB_TLS_PUBLISH=127.0.0.1:18443"
          } > .env.mesh-lab.ci

      - name: Generate TLS certificates
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/mesh-lab-tls-certs.sh
          MESH_LAB_TLS_FORCE_REGEN=1 ./scripts/mesh-lab-tls-certs.sh

      - name: Start mesh lab with TLS proxy
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/docker-compose.mesh-lab.yml \
            -f deploy/compose/docker-compose.mesh-lab-tls.override.yml \
            --env-file .env.mesh-lab.ci up -d --build

      - name: Wait for HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsSk --http1.1 "https://127.0.0.1:18443/health" >/dev/null; then
              echo "TLS health ok after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/docker-compose.mesh-lab.yml \
            -f deploy/compose/docker-compose.mesh-lab-tls.override.yml \
            --env-file .env.mesh-lab.ci logs
          exit 1

      - name: Run TLS verify script
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/mesh-lab-verify-tls.sh
          ./scripts/mesh-lab-verify-tls.sh .env.mesh-lab.ci

      - name: Tear down
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/docker-compose.mesh-lab.yml \
            -f deploy/compose/docker-compose.mesh-lab-tls.override.yml \
            --env-file .env.mesh-lab.ci down -v || true
          rm -f .env.mesh-lab.ci
