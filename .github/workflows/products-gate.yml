# Runs extractable product-scaffold tests. Path-filtered; also listed in ci/test-ownership.tsv.
name: products-gate

on:
  pull_request:
    paths:
      - ".github/workflows/products-gate.yml"
      - "products/**"
      - "src/Ashlar.Contracts/Distributed/**"
      - "src/Ashlar.Hosting/Sdk/Options/AshlarDeploymentProfile.cs"
      - "src/Ashlar.Hosting/AshlarServiceCollectionExtensions.Deployment.cs"
      - "src/Ashlar.Abstractions/AshlarDeploymentProfileEnvironment.cs"
      - "src/Ashlar.Tests.Contracts/DistributedContractTests.cs"
      - "scripts/verify-open-commercial-dependency-boundary.py"
      - "ci/test-ownership.tsv"
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/products-gate.yml"
      - "products/**"
      - "src/Ashlar.Contracts/Distributed/**"
      - "src/Ashlar.Hosting/Sdk/Options/AshlarDeploymentProfile.cs"
      - "src/Ashlar.Hosting/AshlarServiceCollectionExtensions.Deployment.cs"
      - "src/Ashlar.Abstractions/AshlarDeploymentProfileEnvironment.cs"
      - "src/Ashlar.Tests.Contracts/DistributedContractTests.cs"
      - "scripts/verify-open-commercial-dependency-boundary.py"
      - "ci/test-ownership.tsv"
  workflow_dispatch:

jobs:
  products:
    name: product scaffolds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Product scaffold tests
        run: |
          set -euo pipefail
          dotnet test products/Ashlar.Products.sln \
            --blame-hang-timeout 120s

      - name: Distributed contract tests
        run: |
          set -euo pipefail
          # One invocation per target framework, each with its own TRX: without -f both frameworks
          # run and the second overwrites the first's TRX, hiding a framework that matched nothing.
          dotnet test src/Ashlar.Tests.Contracts/Ashlar.Tests.Contracts.csproj \
            -f net8.0 \
            --filter FullyQualifiedName~DistributedContractTests \
            --logger "trx;LogFileName=distributed-contracts-net8.0.trx" --results-directory test-results \
            --blame-hang-timeout 120s
          dotnet test src/Ashlar.Tests.Contracts/Ashlar.Tests.Contracts.csproj \
            -f net10.0 \
            --filter FullyQualifiedName~DistributedContractTests \
            --logger "trx;LogFileName=distributed-contracts-net10.0.trx" --results-directory test-results \
            --blame-hang-timeout 120s
          bash scripts/ci/zero-test-guard.sh test-results/distributed-contracts-net8.0.trx test-results/distributed-contracts-net10.0.trx
