name: Allocator arithmetic public API probes
on:
  push:
    branches: [codex/dogfood-allocator-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run public API probes through Linux harness
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-in-container.sh --ref HEAD -- 'dotnet test src/Ashlar.Tests.Orchestration/Ashlar.Tests.Orchestration.csproj --framework net8.0 --filter FullyQualifiedName~ResourceArithmeticTests --nologo -v minimal' 2>&1 | tee arithmetic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allocator-arithmetic-observations
          path: arithmetic.log
