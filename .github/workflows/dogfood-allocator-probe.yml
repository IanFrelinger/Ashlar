name: Allocator arithmetic public API probes
on:
  push:
    branches: [codex/dogfood-allocator-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run public API probes through Linux harness
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-in-container.sh --ref efe85a74aec57e5ce084efd2ad57e61cde69fced -- 'set -euo pipefail; probe_dir=$(mktemp -d /tmp/ashlar-arithmetic.XXXXXX); printf "%s" "" | base64 --decode > "$probe_dir/Program.cs"; printf "%s" "" | base64 --decode > "$probe_dir/ArithmeticProbe.csproj"; dotnet run --project "$probe_dir/ArithmeticProbe.csproj" --framework net8.0 -p:AshlarRoot=/repo' 2>&1 | tee arithmetic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allocator-arithmetic-observations
          path: arithmetic.log
