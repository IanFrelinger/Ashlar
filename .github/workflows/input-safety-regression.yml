name: Input safety regressions

on:
  pull_request:
    paths:
      - 'src/Ashlar.Manifest/**'
      - 'src/Ashlar.Tests.Kernel/**'
      - 'tools/InputSafetyProbe/**'
      - 'scripts/input-safety-regression.sh'
      - 'scripts/mutations/input-safety.json'
      - '.github/workflows/input-safety-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: input-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-and-mutations:
    name: Input safety net8/net10 and mutation proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Kernel suite and fresh-process probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/input-safety"
          bash scripts/test-in-container.sh -- 'bash scripts/input-safety-regression.sh' \
            2>&1 | tee "${RUNNER_TEMP}/input-safety/tests.log"

      - name: Assertion-level mutation proofs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-in-container.sh -- \
            'python3 scripts/run-spec007-mutation-batch.py --manifest scripts/mutations/input-safety.json --archive-stdout' \
            2>&1 | tee "${RUNNER_TEMP}/input-safety/mutations.log"

      - name: Decode mutation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/input-safety/mutations.log" ]; then
            python3 scripts/decode-spec007-mutation-evidence.py \
              --log "${RUNNER_TEMP}/input-safety/mutations.log" \
              --output "${RUNNER_TEMP}/input-safety/mutation-evidence" --repo .
          fi

      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: input-safety-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/input-safety
          if-no-files-found: error
