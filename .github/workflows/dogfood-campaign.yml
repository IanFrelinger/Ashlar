name: Dogfood Campaign

on:
  push:
    branches:
      - master
      - main
      - claude/dogfood-demos
      - "cursor/**"
    paths:
      - ".github/workflows/dogfood-campaign.yml"
      - ".docker/Dockerfile.devtest"
      - ".devcontainer/**"
      - "scripts/run-in-devcontainer.sh"
      - "scripts/run-dogfood-campaign.sh"
      - "scripts/handoff/devbox.sh"
      - "scripts/ensure-devtest-image.sh"
      - "docs/background-agents/examples/dogfood-campaign.json"
      - "src/Ashlar.BackgroundAgents/Campaign/**"
      - "application/src/Ashlar.CLI/Commands/Dogfood*.cs"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/dogfood-campaign.yml"
      - ".docker/Dockerfile.devtest"
      - "scripts/run-in-devcontainer.sh"
      - "scripts/run-dogfood-campaign.sh"
      - "scripts/handoff/devbox.sh"
      - "src/Ashlar.BackgroundAgents/Campaign/**"
      - "application/src/Ashlar.CLI/Commands/Dogfood*.cs"
      - "Makefile"
  workflow_dispatch:

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run campaign in the repo's dev/test container
        run: bash scripts/run-dogfood-campaign.sh
