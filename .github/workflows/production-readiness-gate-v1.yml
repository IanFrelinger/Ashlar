name: Production Readiness Gate v1

on:
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/production-readiness-gate-v1.yml"
      - "docs/ProductionReadinessGate-v1.md"
      - "docs/ReleaseCandidateChecklist-v1.md"
      - "src/Ashlar.Core.Application/Pipelines/**"
      - "src/Ashlar.Infrastructure/Pipelines/**"
      - "application/src/Ashlar.CLI/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/Pipelines/**"
      - "application/src/Ashlar.Tests.CLI/**"
  workflow_dispatch:
jobs:
  gate-v1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        shell: bash
        run: |
          dotnet restore src/Ashlar.Core.Application/Ashlar.Core.Application.csproj
          dotnet restore src/Ashlar.Infrastructure/Ashlar.Infrastructure.csproj
          dotnet restore application/src/Ashlar.CLI/Ashlar.CLI.csproj
          dotnet restore src/Ashlar.Tests.Infrastructure/scripts/copy-assemblies.csproj
          dotnet restore src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj

      - name: Build checks
        shell: bash
        run: |
          dotnet build src/Ashlar.Core.Application/Ashlar.Core.Application.csproj -f netstandard2.0 --no-restore -v minimal
          dotnet build src/Ashlar.Infrastructure/Ashlar.Infrastructure.csproj --no-restore -v minimal
          dotnet build application/src/Ashlar.CLI/Ashlar.CLI.csproj --no-restore -v minimal

      - name: Pipeline tests (net8)
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            -f net8.0 \
            --filter "FullyQualifiedName~Pipelines" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=gate-pipelines-net8.trx" \
            --results-directory test-results
          bash scripts/ci/zero-test-guard.sh test-results/gate-pipelines-net8.trx

      - name: Pipeline tests (net10)
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            -f net10.0 \
            --filter "FullyQualifiedName~Pipelines" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=gate-pipelines-net10.trx" \
            --results-directory test-results
          bash scripts/ci/zero-test-guard.sh test-results/gate-pipelines-net10.trx

      - name: Host DI smoke
        shell: bash
        run: |
          dotnet test src/Ashlar.Tests.Infrastructure/Ashlar.Tests.Infrastructure.csproj \
            -f net8.0 \
            --filter "FullyQualifiedName~HostingE2ESmokeTests.AddAshlar_RegistersObservationPipeline_ByDefault|FullyQualifiedName~Pipelines.PipelineServiceCollectionExtensionsTests.AddAshlar_RegistersPipelineCompositionLayerByDefault" \
            --logger "console;verbosity=minimal" \
            --logger "trx;LogFileName=gate-host-di.trx" \
            --results-directory test-results
          bash scripts/ci/zero-test-guard.sh test-results/gate-host-di.trx

      - name: CLI operational checks
        shell: bash
        run: |
          TMP_ROOT="$RUNNER_TEMP"
          TEMPLATE_PATH="$TMP_ROOT/pipeline_gate_demo.json"
          VALIDATE_LOG="$TMP_ROOT/gate-validate.log"
          UNCONFIGURED_LOG="$TMP_ROOT/gate-run-unconfigured.log"
          HOOKS_LOG="$TMP_ROOT/gate-run-hooks.log"
          DIAGNOSTICS_LOG="$TMP_ROOT/gate-diagnostics.log"

          cat > "$TEMPLATE_PATH" <<'JSON'
          {
            "templateId": "gate-demo",
            "version": "1.0",
            "stages": [
              { "id": "ingest", "name": "Ingest", "mode": "Deterministic" },
              { "id": "hybrid", "name": "Hybrid", "mode": "Hybrid", "fallbackChain": ["Deterministic", "Agentic"] }
            ],
            "edges": [
              { "fromStageId": "ingest", "toStageId": "hybrid" }
            ]
          }
          JSON

          run_expecting_failure() {
            local log="$1"
            shift
            set +e
            "$@" | tee "$log"
            local exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              echo "expected non-zero from: $*"
              exit 1
            fi
          }

          dotnet run --project application/src/Ashlar.CLI/Ashlar.CLI.csproj -- pipeline validate --template "$TEMPLATE_PATH" | tee "$VALIDATE_LOG"
          run_expecting_failure "$UNCONFIGURED_LOG" \
            dotnet run --project application/src/Ashlar.CLI/Ashlar.CLI.csproj -- pipeline run --template "$TEMPLATE_PATH" --run-id gate-run-unconfigured --format-json
          # Test hooks inject extra failures; they must not restore fabricated success
          # for the unconfigured default adapter.
          ASHLAR_PIPELINE_ENABLE_TEST_HOOKS=1 ASHLAR_PIPELINE_COMPLETION_POLICY=AllowNonCriticalStageFailures \
            run_expecting_failure "$HOOKS_LOG" \
            dotnet run --project application/src/Ashlar.CLI/Ashlar.CLI.csproj -- pipeline run --template "$TEMPLATE_PATH" --run-id gate-run-hooks --input "fail:hybrid:deterministic=true" --format-json
          dotnet run --project application/src/Ashlar.CLI/Ashlar.CLI.csproj -- pipeline diagnostics --format-json | tee "$DIAGNOSTICS_LOG"

          python - <<'PY'
          import os
          import json

          def parse_final_json(path: str) -> dict:
              with open(path, "r", encoding="utf-8") as fh:
                  lines = [line.strip() for line in fh.readlines()]
              json_lines = [line for line in lines if line.startswith("{") and line.endswith("}")]
              if not json_lines:
                  raise SystemExit(f"No JSON payload found in {path}")
              return json.loads(json_lines[-1])

          def assert_fail_closed(payload: dict, label: str) -> None:
              if payload.get("ok"):
                  raise SystemExit(f"{label}: unconfigured pipeline run must not report ok=true")
              data = payload.get("data") or {}
              if data.get("state") != "Failed":
                  raise SystemExit(f"{label}: expected state Failed, got {data.get('state')}")
              ingest = next((s for s in data.get("stages", []) if s.get("stageId") == "ingest"), None)
              if ingest is None:
                  raise SystemExit(f"{label}: missing ingest stage")
              error = ingest.get("error") or ""
              if "No deterministic pipeline adapter is configured" not in error:
                  raise SystemExit(f"{label}: ingest did not fail closed on the placeholder adapter: {error!r}")

          tmp_root = os.environ["RUNNER_TEMP"]
          assert_fail_closed(parse_final_json(os.path.join(tmp_root, "gate-run-unconfigured.log")), "unconfigured")
          assert_fail_closed(parse_final_json(os.path.join(tmp_root, "gate-run-hooks.log")), "test-hooks")
          PY

      - name: Durable resume checks (LiteDb)
        shell: bash
        run: |
          TMP_ROOT="$RUNNER_TEMP"
          TEMPLATE_PATH="$TMP_ROOT/pipeline_gate_demo.json"
          RESUME_DB="$TMP_ROOT/ashlar_pipeline_gate_resume.db"
          RESUME_SOURCE_LOG="$TMP_ROOT/gate-resume-source.log"
          RESUME_TARGET_LOG="$TMP_ROOT/gate-resume-target.log"

          run_expecting_failure() {
            local log="$1"
            shift
            set +e
            "$@" | tee "$log"
            local exit_code=$?
            set -e
            if [ "$exit_code" -eq 0 ]; then
              echo "expected non-zero from: $*"
              exit 1
            fi
          }

          ASHLAR_PIPELINE_STORE_PROVIDER=LiteDb ASHLAR_PIPELINE_STORE_PATH="$RESUME_DB" ASHLAR_PIPELINE_ENABLE_TEST_HOOKS=1 \
            run_expecting_failure "$RESUME_SOURCE_LOG" \
            dotnet run --project application/src/Ashlar.CLI/Ashlar.CLI.csproj -- pipeline run --template "$TEMPLATE_PATH" --run-id gate-resume-source --input "fail:ingest:deterministic=true" --format-json

          ASHLAR_PIPELINE_STORE_PROVIDER=LiteDb ASHLAR_PIPELINE_STORE_PATH="$RESUME_DB" \
            run_expecting_failure "$RESUME_TARGET_LOG" \
            dotnet run --project application/src/Ashlar.CLI/Ashlar.CLI.csproj -- pipeline run --template "$TEMPLATE_PATH" --run-id gate-resume-target --resume-run-id gate-resume-source --resume-failed-stages --format-json

          python - <<'PY'
          import os
          import json

          def parse_final_json(path: str) -> dict:
              with open(path, "r", encoding="utf-8") as fh:
                  lines = [line.strip() for line in fh.readlines()]
              json_lines = [line for line in lines if line.startswith("{") and line.endswith("}")]
              if not json_lines:
                  raise SystemExit(f"No JSON payload found in {path}")
              return json.loads(json_lines[-1])

          tmp_root = os.environ["RUNNER_TEMP"]
          source = parse_final_json(os.path.join(tmp_root, "gate-resume-source.log"))
          target = parse_final_json(os.path.join(tmp_root, "gate-resume-target.log"))

          if source.get("data", {}).get("state") != "Failed":
              raise SystemExit("Source run is expected to fail for durable resume check")
          if target.get("ok"):
              raise SystemExit("Resumed target must not report ok=true without a configured adapter")
          if target.get("data", {}).get("state") != "Failed":
              raise SystemExit(f"Resumed target must stay Failed, got {target.get('data', {}).get('state')}")
          err = json.dumps(target)
          if "no prior run was found" in err:
              raise SystemExit("Resume did not find the persisted source run")
          PY

      - name: Cleanup temp artifacts
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pipeline_gate_demo.json" "$RUNNER_TEMP/ashlar_pipeline_gate_resume.db"

      - name: Upload test and gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-gate-v1-artifacts-${{ matrix.os }}
          path: |
            test-results/**/*.trx
            ${{ runner.temp }}/gate-validate.log
            ${{ runner.temp }}/gate-run-unconfigured.log
            ${{ runner.temp }}/gate-run-hooks.log
            ${{ runner.temp }}/gate-diagnostics.log
            ${{ runner.temp }}/gate-resume-source.log
            ${{ runner.temp }}/gate-resume-target.log
          retention-days: 14
