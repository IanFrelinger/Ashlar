name: Installer Bruteforce Gate

on:
  workflow_dispatch:

jobs:
  bruteforce-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.403
            8.0.427

      - name: Run installer brute-force matrix
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install/bruteforce-matrix.sh

      - name: Upload brute-force artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-bruteforce-matrix
          path: |
            ./.artifacts/install_bruteforce_matrix.log
            ./.artifacts/install_bruteforce_summary.log
          retention-days: 14
