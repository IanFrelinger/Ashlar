# Validates external links in README + docs (relative links resolved from repo root).
name: Docs Link Check

on:
  pull_request:
    # Always run on PRs (no path filter) to serve as a required check.
    # Fast enough (~30s) to run unconditionally without blocking CI.
  push:
    branches:
      - master
      - main
      - "cursor/**"
  # Merge queue. A required check that does not run on `merge_group` never reports, and the
  # queue waits on it forever - so this is deliberately unfiltered, exactly like the
  # `pull_request` trigger above.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-link-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: lychee (README + docs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run lychee
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --max-concurrency 8 --user-agent "ashlar-docs-link-check" README.md "docs/**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # lychee-action downloads its binary from GitHub Releases. That curl
      # occasionally dies with SSL connect error 35 before any links are checked
      # (PR run on f95b9eb5; the push run of the same SHA succeeded).
      - name: Retry lychee after install flake
        if: steps.lychee.outcome == 'failure'
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --max-concurrency 8 --user-agent "ashlar-docs-link-check" README.md "docs/**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
