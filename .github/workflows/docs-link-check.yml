# Validates external links in README + docs (relative links resolved from repo root).
name: Docs Link Check

on:
  pull_request:
    # Always run on PRs (no path filter) to serve as a required check.
    # Fast enough (~30s) to run unconditionally without blocking CI.
  push:
    branches:
      - master
      - main
      - "cursor/**"
  # Merge queue. A required check that does not run on `merge_group` never reports, and the
  # queue waits on it forever - so this is deliberately unfiltered, exactly like the
  # `pull_request` trigger above.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-link-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: lychee (README + docs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Keep installation retries separate from the link check: broken links must fail.
      - name: Install pinned lychee with bounded retries
        run: bash scripts/ci/install-lychee.sh

      - name: Run lychee
        id: lychee
        run: bash scripts/ci/check-docs-links.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
