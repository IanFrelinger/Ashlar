name: perf-certification

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline label for this certification run (e.g. release tag or commit SHA)"
        required: false
        default: "manual"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  perf-tests:
    name: perf-certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Run perf / benchmark-scoped tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          echo "{\"baseline\":\"${{ github.event.inputs.baseline }}\",\"runId\":\"${{ github.run_id }}\",\"sha\":\"${{ github.sha }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > perf-results/perf-certification-meta.json
          # One invocation over the whole solution, so every test project runs (most match nothing).
          # It used ONE LogFileName in ONE results directory, and each project's TRX overwrote the
          # previous one ("WARNING: Overwriting results file"): the file that survived was whichever
          # project finished last, and the metrics step below read that. LogFilePrefix names each TRX
          # <prefix>_<tfm>_<yyyyMMddHHmmss>.trx, and leaving --results-directory unset keeps each
          # project's under its own TestResults/, so two projects finishing in the same second cannot
          # collide either (measured: two projects in one run both named theirs
          # perf-certification_net8.0_20260930163958.trx). They are then gathered under perf-results/trx,
          # one file per project and framework, and guarded in --solution mode: at least one project
          # must have executed a test.
          #
          # The gather runs BEFORE the test's exit code is honoured. A failing run is the one whose
          # results matter most, and under `set -e` a bare `dotnet test` would exit before the copy:
          # the metrics step (if: always()) would then find no TRX and report 0 tests, 0 failed, and
          # the uploaded artifact would carry none. `|| rc=$?` keeps the code; it is re-raised below.
          rc=0
          dotnet test Ashlar.sln \
            --configuration Release \
            --logger "trx;LogFilePrefix=perf-certification" \
            --filter "FullyQualifiedName~Ashlar.Tests.Orchestration.Performance|FullyQualifiedName~Benchmark" \
            --verbosity minimal || rc=$?
          mkdir -p perf-results/trx
          while IFS= read -r -d '' trx; do
            project="$(basename "$(dirname "$(dirname "$trx")")")"
            cp "$trx" "perf-results/trx/${project}__$(basename "$trx")"
          done < <(find . -path '*/TestResults/perf-certification_*.trx' -not -path './perf-results/*' -print0)
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::dotnet test exited ${rc}; its TRX files are kept in perf-results/trx"
            exit "$rc"
          fi
          bash scripts/ci/zero-test-guard.sh --solution perf-results/trx/*__perf-certification_*.trx

      - name: Extract perf metrics and check thresholds
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT_FILE="perf-results/perf-certification-report.json"

          TOTAL=0
          PASSED=0
          FAILED=0
          DURATION_MS=0

          # Summed over every project's TRX. This read ONE file (find -print -quit), and with every
          # project writing the same name that file was whichever project finished last.
          # `grep -c` prints 0 AND exits 1 on no match, so `|| echo 0` produced "0<newline>0"; `|| true`
          # keeps the single 0.
          for TRX_FILE in perf-results/trx/*.trx; do
            [[ -f "$TRX_FILE" ]] || continue
            TOTAL=$(( TOTAL + $(grep -c '<UnitTestResult' "$TRX_FILE" || true) ))
            PASSED=$(( PASSED + $(grep -c 'outcome="Passed"' "$TRX_FILE" || true) ))
            FAILED=$(( FAILED + $(grep -c 'outcome="Failed"' "$TRX_FILE" || true) ))
          done

          PASS_RATE=0
          if [[ "$TOTAL" -gt 0 ]]; then
            PASS_RATE=$(( (PASSED * 100) / TOTAL ))
          fi

          THRESHOLD_PASS_RATE=95
          VERDICT="PASS"
          if [[ "$PASS_RATE" -lt "$THRESHOLD_PASS_RATE" ]]; then
            VERDICT="FAIL"
          fi
          if [[ "$FAILED" -gt 0 ]]; then
            VERDICT="FAIL"
          fi

          cat > "$REPORT_FILE" <<EOF
          {
            "baseline": "${{ github.event.inputs.baseline }}",
            "sha": "${{ github.sha }}",
            "runId": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "totalTests": $TOTAL,
            "passed": $PASSED,
            "failed": $FAILED,
            "passRate": $PASS_RATE,
            "thresholds": {
              "minPassRate": $THRESHOLD_PASS_RATE,
              "maxFailedTests": 0
            },
            "verdict": "$VERDICT"
          }
          EOF

          echo "## Perf Certification Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total tests | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Passed | $PASSED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Failed | $FAILED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pass rate | ${PASS_RATE}% (threshold: ${THRESHOLD_PASS_RATE}%) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Verdict** | **$VERDICT** |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VERDICT" == "FAIL" ]]; then
            echo "::error::Perf certification FAILED: pass rate ${PASS_RATE}% below threshold ${THRESHOLD_PASS_RATE}% or ${FAILED} test(s) failed"
            exit 1
          fi

      - name: Upload perf certification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-certification-${{ github.run_id }}
          path: perf-results/
          retention-days: 90
