# Reusable: restore StableSdkHostSample from nuget.org only (post-publish smoke).
# Retries for nuget.org index lag after push.

on:
  workflow_call:
    inputs:
      package_version:
        description: "Semver with optional v prefix (e.g. 1.2.3 or v1.2.3)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify-nuget-consumer:
    name: Verify NuGet consumer (nuget.org)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # global.json pins the 10.0.x SDK; the sample runs on it (RollForward=Major covers net8.0 consumers).
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.403
            8.0.427

      - name: Resolve semver (strip v prefix)
        shell: bash
        run: |
          VER="${{ inputs.package_version }}"
          VER="${VER#v}"
          echo "VERIFY_NUGET_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Verifying consumer install for Ashlar.Hosting.Bundle **$VER** on nuget.org"

      - name: Restore sample from nuget.org (retry for index lag)
        shell: bash
        run: |
          set -euo pipefail
          max=12
          delay=20
          for i in $(seq 1 "$max"); do
            echo "Attempt $i/$max ..."
            if bash scripts/verify-stable-sdk-host-sample-published-feed.sh "${VERIFY_NUGET_VERSION}"; then
              echo "verify-nuget-consumer: OK"
              exit 0
            fi
            if [ "$i" -lt "$max" ]; then
              echo "Retry in ${delay}s (nuget.org index may not list the new version yet) ..."
              sleep "$delay"
            fi
          done
          echo "verify-nuget-consumer: FAILED after $max attempts"
          exit 1
