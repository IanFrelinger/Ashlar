name: Lineage and proposal durability

on:
  pull_request:
    paths:
      - 'src/Ashlar.BackgroundAgents/Registry/**'
      - 'src/Ashlar.BackgroundAgents/Scheduling/**'
      - 'src/Ashlar.BackgroundAgents/Configuration/BackgroundAgentConfig.cs'
      - 'src/Ashlar.BackgroundAgents/Forge/**'
      - 'src/Ashlar.Tests.BackgroundAgents/SelfExtend/SelfExtendInvariantDRecursionCeilingTests.cs'
      - 'src/Ashlar.Tests.BackgroundAgents/Forge/**'
      - 'scripts/lineage-proposal-regression.sh'
      - 'scripts/proposal-store-crash-probe.py'
      - 'scripts/mutations/lineage-proposal.json'
      - '.github/workflows/lineage-proposal-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lineage-proposal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-and-mutations:
    name: Lineage and proposal focused tests and mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Evidence names the exact proposed source, not a moving merge simulation.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Focused net8/net10 and subprocess crash recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/lineage-proposal"
          bash scripts/test-in-container.sh -- 'bash scripts/lineage-proposal-regression.sh' \
            2>&1 | tee "${RUNNER_TEMP}/lineage-proposal/focused.log"

      - name: Lineage and durable-store mutation proofs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-in-container.sh -- \
            'python3 scripts/run-spec007-mutation-batch.py --manifest scripts/mutations/lineage-proposal.json --archive-stdout' \
            2>&1 | tee "${RUNNER_TEMP}/lineage-proposal/mutations.log"

      - name: Decode mutation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/lineage-proposal/mutations.log" ]; then
            python3 scripts/decode-spec007-mutation-evidence.py \
              --log "${RUNNER_TEMP}/lineage-proposal/mutations.log" \
              --output "${RUNNER_TEMP}/lineage-proposal/mutation-evidence" --repo .
          fi

      - name: Upload exact-SHA validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-proposal-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/lineage-proposal
          if-no-files-found: error
