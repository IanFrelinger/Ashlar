# Ensures scripts/pack-ashlar-hosting-graph.{sh,ps1} match the transitive Ashlar.* graph from Ashlar.Hosting (+ optional allowlist).
name: Pack hosting graph alignment

on:
  push:
    branches: [master, main]
    paths:
      - "src/**/*.csproj"
      - "scripts/pack-ashlar-hosting-graph.sh"
      - "scripts/pack-ashlar-hosting-graph.ps1"
      - "scripts/pack-ashlar-hosting-graph.allowlist.txt"
      - "scripts/verify-pack-ashlar-hosting-graph-alignment.py"
      - "scripts/verify-nuget-org-packages-visible.sh"
      - "scripts/verify-nuget-org-restore-published-version.sh"
      - "scripts/verify-nuget-org-restore-with-isolated-cache.sh"
      - "docs/samples/NugetOrgRestoreVerify/**"
      - "Directory.Build.props"
      - ".github/workflows/pack-hosting-graph-alignment.yml"
      - ".github/workflows/reusable-release-nuget.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.403
            8.0.427

      - name: Verify pack list vs MSBuild graph
        run: python3 scripts/verify-pack-ashlar-hosting-graph-alignment.py
