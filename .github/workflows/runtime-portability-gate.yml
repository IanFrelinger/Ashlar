# Runtime Portability Gate
#
# Every other gate builds and runs on the 8.0 and 10.0 runtimes. Ashlar.Certification.Contracts
# ships lib/net8.0 for everything between those, and a net9.0 consumer is silently bound to that
# asset by NuGet — an asset never once executed on a 9.0.x runtime in CI, because no workflow
# pins 9.0.x at all. This gate does: it packs the contracts with the SDK from global.json, then
# EXECUTES a consumer on the 9.0 runtime (scripts/portability/net9-probe.sh) that mints and
# verifies a record with HMAC and Ed25519 and compares the canonical signing bytes against the
# checked-in golden corpus. Execution, not compilation: the ns2.0 asset was compiled in three
# CI places and nothing caught anything until a probe actually ran it.
#
# The second lane asks the other half of the same question. A host does not have to publish the
# way `dotnet build` does, and the canonical signing payload plus the certified transition entry
# hash must come out byte-identical when it does not. `scripts/portability/trim-aot-canonical-bytes-probe.sh`
# publishes a minimal certification consumer SELF-CONTAINED and TRIMMED (partial, full, and full
# with the reflection-based serializer explicitly re-enabled) and AHEAD-OF-TIME, then RUNS each
# published binary against the same checked-in corpora the xunit golden suites read. It also
# requires each binary to still REFUSE - a tampered signature, a content hash that no longer
# binds, a schema version that selects no payload lane, a repeated proposer parameter key, a
# double JSON has no number for - because a build whose verifier had been trimmed into
# unconditional agreement would emit the right bytes and pass a positive-only probe.
#
# The third lane runs the asset the package ships FOR external consumers. netstandard2.0 is not
# a runtime, so there is nothing to run tests "on"; the only honest way to show that asset agrees
# is to execute it where it is really loaded, in a .NET Framework consumer under Mono.
# scripts/ns20-canonical-bytes-probe.sh has existed since #585 and nothing in CI called it — while
# netstandard2.0 is the leg that has actually diverged, twice: the verifier contradictions closed
# by #585 and the double formatting closed by #592. A probe nothing runs is a measurement nobody
# has taken. It re-reads its own transcript (five section PASS lines, a Mono runtime line, no FAIL
# lines, a non-trivial per-case count) rather than trusting an exit code.
#
# ADVISORY. Path-filtered, so it cannot be a required status check (a required context that
# never reports blocks the merge forever — see docs/CiGateInventory.md). It does not use
# `continue-on-error`: a red run here is a real runtime regression and must be read as one.
# Promotion to required goes through the always-report pattern (#571) and the branch-protection
# docs in the same PR.
name: Runtime Portability Gate

on:
  workflow_dispatch:
  schedule:
    # Weekly: setup-dotnet resolves 9.0.x / 10.0.x to whatever patch is current, so a runtime
    # patch can change this lane's answer without any push to the repo.
    - cron: "0 11 * * 1"
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - ".github/workflows/runtime-portability-gate.yml"
      - "scripts/portability/**"
      # The Mono lane's probe does not live under scripts/portability/; without this line the
      # job exists and never fires, which is the same as not having it.
      - "scripts/ns20-canonical-bytes-probe.sh"
      - "src/Ashlar.Certification.Contracts/**"
      # The trim/AOT consumer references State and reads its corpus, so a change to either must
      # fire this workflow. Without these two lines the lane looks healthy by never running.
      - "src/Ashlar.Certification.State/**"
      - "src/Ashlar.Compat/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/Certification/canonical-payloads.golden.json"
      - "src/Ashlar.Tests.Infrastructure/Tests/Certification/transition-entry-hashes.golden.json"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
  pull_request:
    paths:
      - ".github/workflows/runtime-portability-gate.yml"
      - "scripts/portability/**"
      # The Mono lane's probe does not live under scripts/portability/; without this line the
      # job exists and never fires, which is the same as not having it.
      - "scripts/ns20-canonical-bytes-probe.sh"
      - "src/Ashlar.Certification.Contracts/**"
      # The trim/AOT consumer references State and reads its corpus, so a change to either must
      # fire this workflow. Without these two lines the lane looks healthy by never running.
      - "src/Ashlar.Certification.State/**"
      - "src/Ashlar.Compat/**"
      - "src/Ashlar.Tests.Infrastructure/Tests/Certification/canonical-payloads.golden.json"
      - "src/Ashlar.Tests.Infrastructure/Tests/Certification/transition-entry-hashes.golden.json"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"

permissions:
  contents: read

concurrency:
  group: runtime-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  net9-runtime-consumer:
    name: net9.0 runtime ← lib/net8.0 asset (execute)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NET9_PROBE_WORKDIR: ${{ runner.temp }}/net9-probe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 10.0.x builds and packs (global.json); 9.0.x is the runtime under test and is pinned
          # nowhere else in CI. The consumer's runtimeconfig asks for 9.0 with the default Minor
          # roll-forward, so 10.0.x beside it is not selected — and the probe asserts the major.
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Installed runtimes
        shell: bash
        run: dotnet --list-runtimes

      - name: Pack contracts (SDK 10), publish net9.0 consumer, execute on the 9.0 runtime
        shell: bash
        run: bash scripts/portability/net9-probe.sh

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="${NET9_PROBE_WORKDIR}/net9-probe.log"
          {
            echo "## Runtime Portability Gate — .NET 9"
            echo ""
            if [[ ! -f "${LOG}" ]]; then
              echo "No probe log at \`${LOG}\` — the build phase failed before the consumer ran (see the job log)."
            else
              # The probe prints one line per check; the summary only re-reads them.
              runtime="$(grep -m1 '^runtime:' "${LOG}" | sed 's/^runtime: *//' || true)"
              contracts="$(grep -m1 '^contracts:' "${LOG}" | grep -oE '\[[^]]+\]' || true)"
              nsec="$(grep -m1 '^nsec:' "${LOG}" | grep -oE '\[[^]]+\]' || true)"
              golden_ok="$(grep -cE '^  OK   v[0-9]' "${LOG}" || true)"
              golden_fail="$(grep -cE '^  FAIL v[0-9]' "${LOG}" || true)"
              verdict_ok="$(grep -cE '^  OK   ' "${LOG}" || true)"
              verdict_fail="$(grep -cE '^  FAIL ' "${LOG}" || true)"
              result="$(grep -E '^(PASS|FAIL):' "${LOG}" | tail -1 || true)"
              echo "| Check | Result |"
              echo "|-------|--------|"
              echo "| Runtime | \`${runtime:-?}\` |"
              echo "| Contracts asset loaded | \`${contracts:-not loaded}\` |"
              echo "| NSec asset loaded (Ed25519) | \`${nsec:-not loaded}\` |"
              echo "| Golden canonical payloads byte-identical | ${golden_ok} OK / ${golden_fail} FAIL |"
              echo "| All checks (bytes + mint/verify + verdicts) | ${verdict_ok} OK / ${verdict_fail} FAIL |"
              echo ""
              echo "**Result:** ${result:-no PASS/FAIL line — the consumer did not finish}"
            fi
            echo ""
            echo "Advisory lane (not a required status check); a red run is a real .NET 9 runtime regression — read it."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      - name: Upload probe log and resolved deps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-portability-net9
          path: |
            ${{ runner.temp }}/net9-probe/net9-probe.log
            ${{ runner.temp }}/net9-probe/net9/Net9Probe.deps.json
            ${{ runner.temp }}/net9-probe/net9/Net9Probe.runtimeconfig.json
          if-no-files-found: warn
          retention-days: 14

  trim-aot-canonical-bytes:
    name: net10.0 trimmed / AOT publish → canonical bytes (execute)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `needs`: the two lanes measure different things and neither gates the other. One job per
    # configuration so a single-mode regression names itself in the check list rather than in a
    # log, and fail-fast off so one red mode does not hide the state of the other three.
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - trim-partial
          - trim-full
          - trim-full-reflection-on
          - aot
    env:
      TRIM_AOT_PROBE_WORKDIR: ${{ runner.temp }}/trim-aot-probe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 10.0.x only, and deliberately only: the consumer is published self-contained, so it
          # carries its own runtime and resolves nothing from an installed one. PublishAot also
          # needs a C toolchain and linker, which the ubuntu-latest image already provides.
          dotnet-version: 10.0.x

      - name: Installed runtimes
        shell: bash
        run: dotnet --list-runtimes

      - name: Publish ${{ matrix.configuration }} self-contained and execute it
        shell: bash
        # The publish properties are written INTO the generated consumer csproj by the probe,
        # never passed as `-p:`. A `-p:` switch is an MSBuild global property: it would flow into
        # the referenced multi-targeted projects, whose netstandard2.0 leg then refuses to build
        # (NETSDK1124 / NETSDK1207), and the configuration named here would never be reached. Do
        # not "simplify" this line into one.
        run: bash scripts/portability/trim-aot-canonical-bytes-probe.sh ${{ matrix.configuration }}

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="${TRIM_AOT_PROBE_WORKDIR}/trim-aot-probe.log"
          {
            echo "## Runtime Portability Gate — ${{ matrix.configuration }}"
            echo ""
            if [[ ! -f "${LOG}" ]]; then
              echo "No probe log at \`${LOG}\` — the publish failed before the binary ran (see the job log)."
            else
              # The probe prints one line per check and one summary line per section; this only
              # re-reads them, so the table cannot disagree with what was measured.
              runtime="$(grep -m1 '^runtime:' "${LOG}" | sed 's/^runtime: *//' || true)"
              warnings="$(grep -m1 '^trim/AOT analysis warnings:' "${LOG}" | sed 's/^.*: *//' || true)"
              ok="$(grep -cE '^  OK   ' "${LOG}" || true)"
              fail="$(grep -cE '^  FAIL ' "${LOG}" || true)"
              bytes="$(grep -m1 -E '^(PASS|FAIL): .*canonical payloads' "${LOG}" || true)"
              hashes="$(grep -m1 -E '^(PASS|FAIL): .*transition entry hashes' "${LOG}" || true)"
              refusals="$(grep -m1 -E '^(PASS|FAIL): .*refusals' "${LOG}" || true)"
              result="$(grep -m1 -E '^PROBE (PASS|FAIL)' "${LOG}" || true)"
              echo "| Check | Result |"
              echo "|-------|--------|"
              echo "| Publish mode | \`${{ matrix.configuration }}\` |"
              echo "| Runtime | \`${runtime:-?}\` |"
              echo "| Trim/AOT analysis warnings | ${warnings:-?} |"
              echo "| Canonical signing payloads | ${bytes:-no line — the binary did not finish this section} |"
              echo "| Certified transition entry hashes | ${hashes:-no line — the binary did not finish this section} |"
              echo "| Refusals (the binary must still say no) | ${refusals:-no line — the binary did not finish this section} |"
              echo "| All checks | ${ok} OK / ${fail} FAIL |"
              echo ""
              echo "**Result:** ${result:-no PROBE line — the consumer did not finish}"
            fi
            echo ""
            echo "Advisory lane (not a required status check); a red run is a real publish-mode regression — read it."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      - name: Upload probe log and publish log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # v4 artifact names must be unique within a run, and four configurations run in parallel.
          name: runtime-portability-trim-aot-${{ matrix.configuration }}
          path: |
            ${{ runner.temp }}/trim-aot-probe/trim-aot-probe.log
            ${{ runner.temp }}/trim-aot-probe/*.run.log
            ${{ runner.temp }}/trim-aot-probe/*.publish.log
          if-no-files-found: warn
          retention-days: 14

  mono-netstandard20-consumer:
    name: netstandard2.0 asset under Mono (execute)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NS20_PROBE_WORKDIR: ${{ runner.temp }}/ns20-probe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Build side only. Nothing here runs the netstandard2.0 asset — that is Mono's job, and
          # Mono arrives as a container image rather than a runtime install.
          dotnet-version: 10.0.x

      - name: Installed runtimes
        shell: bash
        run: dotnet --list-runtimes

      # netstandard2.0 is not a runtime, so there is nothing to "run the tests on". The only
      # honest way to show the ns2.0 asset agrees with net8.0 is to execute it where it is really
      # loaded: a .NET Framework consumer, under Mono. The script has existed since #585 and
      # nothing in CI called it — and netstandard2.0 is the leg that has actually diverged, twice
      # (the verifier contradictions closed by #585, the double formatting closed by #592). A
      # probe nothing runs is a measurement nobody has taken.
      - name: Build the net472 consumer and execute the ns2.0 asset under Mono
        shell: bash
        run: bash scripts/ns20-canonical-bytes-probe.sh

      - name: Job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="${NS20_PROBE_WORKDIR}/ns20-probe.log"
          {
            echo "## Runtime Portability Gate — netstandard2.0 under Mono"
            echo ""
            if [[ ! -f "${LOG}" ]]; then
              echo "No probe log at \`${LOG}\` — the build phase failed before the consumer ran (see the job log)."
            else
              # The probe prints one line per check and then re-reads them itself; the summary only
              # reports what it found.
              runtime="$(grep -m1 '^runtime:' "${LOG}" | sed 's/^runtime: *//' || true)"
              contracts="$(grep -m1 '^contracts:' "${LOG}" | sed 's/^contracts: *//' || true)"
              ok="$(grep -cE '^  OK' "${LOG}" || true)"
              bad="$(grep -cE '^  FAIL' "${LOG}" || true)"
              sections="$(grep -cE '^PASS: ' "${LOG}" || true)"
              echo "| Check | Result |"
              echo "|-------|--------|"
              echo "| Runtime | \`${runtime:-?}\` |"
              echo "| Contracts asset loaded | \`${contracts:-not loaded}\` |"
              echo "| Sections passed | ${sections} / 5 |"
              echo "| Per-case checks | ${ok} OK / ${bad} FAIL |"
              echo ""
              echo "Sections: canonical payload bytes, certified transition entry hashes, verifier parity with net8.0, StateLogVerifier options, unknown schema versions."
            fi
            echo ""
            echo "Advisory lane (not a required status check); a red run is a real netstandard2.0 regression — read it."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-portability-ns20-mono
          path: ${{ runner.temp }}/ns20-probe/ns20-probe.log
          if-no-files-found: warn
          retention-days: 14
