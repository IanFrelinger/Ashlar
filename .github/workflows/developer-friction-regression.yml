name: Developer friction regression

on:
  pull_request:
    paths:
      - 'src/Ashlar.BackgroundAgents/Trust/**'
      - 'src/Ashlar.Tests.BackgroundAgents/Trust/SanitizationAuditLogContractTests.cs'
      - 'samples/hello-brick/**'
      - 'samples/templates/brick/**'
      - 'application/src/Ashlar.CLI/Commands/RuntimeCommand*'
      - 'application/src/Ashlar.CLI/Commands/Runtime/**'
      - 'application/src/Ashlar.Tests.CLI/Tests/Commands/RuntimeCommandTests.cs'
      - 'scripts/developer-friction-regression.sh'
      - 'scripts/mutations/developer-friction.json'
      - '.github/workflows/developer-friction-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-friction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-and-mutations:
    name: Developer friction focused tests and mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # Evidence names the exact proposed source, not a moving merge simulation.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Focused net8/net10, sample, and runtime-command cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/developer-friction"
          bash scripts/test-in-container.sh -- 'bash scripts/developer-friction-regression.sh' \
            2>&1 | tee "${RUNNER_TEMP}/developer-friction/focused.log"

      - name: Audit limit and sample contract mutation proofs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-in-container.sh -- \
            'python3 scripts/run-spec007-mutation-batch.py --manifest scripts/mutations/developer-friction.json --archive-stdout' \
            2>&1 | tee "${RUNNER_TEMP}/developer-friction/mutations.log"

      - name: Decode mutation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/developer-friction/mutations.log" ]; then
            python3 scripts/decode-spec007-mutation-evidence.py \
              --log "${RUNNER_TEMP}/developer-friction/mutations.log" \
              --output "${RUNNER_TEMP}/developer-friction/mutation-evidence" --repo .
          fi

      - name: Upload exact-SHA validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-friction-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/developer-friction
          if-no-files-found: error
