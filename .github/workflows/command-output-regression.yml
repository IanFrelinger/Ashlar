name: Command output contracts

on:
  pull_request:
    paths:
      - 'application/src/Ashlar.CLI/**'
      - 'application/src/Ashlar.Tests.CLI/**'
      - 'scripts/command-output-regression.sh'
      - 'scripts/mutations/command-output.json'
      - '.github/workflows/command-output-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-output-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-and-mutations:
    name: Command contract tests and mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Invocation and process output regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/command-output"
          bash scripts/test-in-container.sh -- 'bash scripts/command-output-regression.sh' \
            2>&1 | tee "${RUNNER_TEMP}/command-output/tests.log"

      - name: Assertion-level mutation proofs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-in-container.sh -- \
            'python3 scripts/run-spec007-mutation-batch.py --manifest scripts/mutations/command-output.json --archive-stdout' \
            2>&1 | tee "${RUNNER_TEMP}/command-output/mutations.log"

      - name: Decode mutation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/command-output/mutations.log" ]; then
            python3 scripts/decode-spec007-mutation-evidence.py \
              --log "${RUNNER_TEMP}/command-output/mutations.log" \
              --output "${RUNNER_TEMP}/command-output/mutation-evidence" --repo .
          fi

      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-output-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/command-output
          if-no-files-found: error
