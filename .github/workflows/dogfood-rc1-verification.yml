name: Verify existing rc1 artifacts (no publication)

on:
  push:
    branches: [codex/rc1-artifact-verification]

permissions:
  contents: read
  actions: read

concurrency:
  group: rc1-readonly-artifact-verification
  cancel-in-progress: false

jobs:
  verify-existing-rc1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out original published source
        uses: actions/checkout@v4
        with:
          ref: 1017c10dd6308b8aafd98817c8eb736cd8ee167b
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare nonpublishing verifier and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/rc1-artifacts work/rc1-evidence
          printf '%s' '' | base64 --decode > work/rc1-post-push-verify.sh
          bash -n work/rc1-post-push-verify.sh
          {
            printf 'Original publish run: 39885204425\n'
            printf 'Original package artifact: 12471414765\n'
            printf 'Original source: '
            git rev-parse HEAD
            printf 'Verification run: %s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            date -u '+Verification started: %Y-%m-%dT%H:%M:%SZ'
          } | tee work/rc1-evidence/provenance.txt

      - name: Download original package artifacts and manifest
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12471414765'
          run-id: '39885204425'
          github-token: ${{ github.token }}
          repository: IanFrelinger/Ashlar
          path: work/rc1-artifacts
          merge-multiple: true

      - name: Verify existing published rc1 inside Linux harness
        shell: bash
        run: |
          set -euo pipefail
          test -f work/rc1-artifacts/nuget-publish-manifest.json
          bash scripts/test-in-container.sh --repo "$GITHUB_WORKSPACE" --ref 1017c10dd6308b8aafd98817c8eb736cd8ee167b -- 'bash /src-mirror/work/rc1-post-push-verify.sh' 2>&1 | tee work/rc1-evidence/post-push-verification.log

      - name: Upload verification receipt even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-existing-artifacts-verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            work/rc1-evidence/
            work/rc1-artifacts/nuget-publish-manifest.json
            work/rc1-post-push-verify.sh
