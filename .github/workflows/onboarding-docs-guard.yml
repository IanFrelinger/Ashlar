name: Onboarding Docs Guard

on:
  # Project inventory drift must be caught before a new project reaches master.
  pull_request:
    paths:
      - "**/*.csproj"
      - "docs/ProjectTiers.md"
      - ".github/workflows/onboarding-docs-guard.yml"
  push:
    branches:
      - master
      - main
      - "cursor/**"
    paths:
      - "README.md"
      - "docs/GettingStarted.md"
      - "docs/DocsIndex.md"
      - "docs/DEPLOYMENT.md"
      - "docs/PUBLISHING.md"
      - "docs/RELEASE_RUNBOOK.md"
      - "docs/CiFirstHardwareSecond.md"
      - ".devcontainer/**"
      - ".github/workflows/onboarding-docs-guard.yml"
      # Referenced-path guard inputs (see "Referenced repo paths must exist" below).
      - "docs/**/*.md"
      - "scripts/*.sh"
      - "scripts/*.ps1"
      - "Makefile"
      # ProjectTiers guard input: a new project must get a row in docs/ProjectTiers.md.
      - "**/*.csproj"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure onboarding has workload-safe startup defaults
        shell: bash
        run: |
          set -euo pipefail

          # README must include lane-based onboarding and safe build path.
          grep -nE "## Quick Start \\(5 minutes\\)" README.md
          grep -nE "### Lane 1 .* Try \\(run the portal\\)" README.md
          grep -nE "### Lane 2 .* Develop \\(dev container \\+ CLI\\)" README.md
          grep -nE "### Lane 3 .* Deploy \\(operators\\)" README.md
          grep -nE "bash scripts/setup/setup\\.sh all" README.md
          grep -nE "dotnet build application/src/Ashlar\\.CLI/Ashlar\\.CLI\\.csproj --no-restore" README.md

          if grep -nE "dotnet build Ashlar\\.sln" README.md >/dev/null 2>&1; then
            echo "README.md should not recommend 'dotnet build Ashlar.sln' in onboarding paths."
            exit 1
          fi

          # GettingStarted should include lane + setup + doctor.
          grep -nE "Lane A \\(fastest\\): container-first" docs/GettingStarted.md
          grep -nE "bash scripts/setup/setup\\.sh all" docs/GettingStarted.md
          grep -nE "dotnet run --project application/src/Ashlar\\.CLI -- doctor --json" docs/GettingStarted.md
          grep -nE "dotnet build application/src/Ashlar\\.CLI/Ashlar\\.CLI\\.csproj --no-restore" docs/GettingStarted.md

          if grep -nE "^dotnet build Ashlar\\.sln$" docs/GettingStarted.md >/dev/null 2>&1; then
            echo "docs/GettingStarted.md should not include 'dotnet build Ashlar.sln' as a runnable command."
            exit 1
          fi

          # Docs index must route users correctly.
          grep -nE "docs/GettingStarted\\.md" docs/DocsIndex.md
          grep -nE "scripts/setup/setup\\.sh" docs/DocsIndex.md
          grep -nE "onboarding-quickstart-gate\\.yml" docs/DocsIndex.md
          grep -nE "devcontainer-gate\\.yml" docs/DocsIndex.md
          grep -nE "docs/RELEASE_RUNBOOK\\.md" docs/DocsIndex.md
          grep -nE "pack-hosting-graph-alignment\\.yml" docs/DocsIndex.md

          # Operator deploy section stays container-first.
          grep -nE "## Deploy \\(operators\\)" README.md
          grep -nE "docs/CiFirstHardwareSecond\\.md" README.md

      # lychee (docs-link-check) only follows Markdown links; inline-code repo paths such as
      # `scripts/foo.sh` are invisible to it. Commit 0bcc2718 deleted scripts/ashlar-ready-gate.sh,
      # scripts/start|stop-ashlar-api-dev.{sh,ps1} and docs/production-readiness/README.md while
      # ~20 docs, the Makefile and run-ollama-docker.* kept pointing at them. This step fails when
      # a backtick-quoted repo path in README/docs/scripts/Makefile does not exist in the checkout.
      - name: Referenced repo paths must exist
        shell: bash
        run: |
          set -euo pipefail

          files=(README.md Makefile)
          while IFS= read -r f; do files+=("$f"); done < <(find docs -type f -name '*.md' | sort)
          while IFS= read -r f; do files+=("$f"); done < <(find scripts -maxdepth 1 -type f \( -name '*.sh' -o -name '*.ps1' \) | sort)

          pattern='`(scripts|docs|deploy|\.github|src|application|applications|samples)/[A-Za-z0-9._/-]+\.(sh|ps1|md|yml|yaml|json|csproj|sln|slnf)`'
          missing=0
          while IFS= read -r token; do
            path="${token#\`}"; path="${path%\`}"
            # Placeholders such as `scripts/<name>.sh` or `docs/{a,b}.md` are not real paths.
            case "$path" in *'<'*|*'{'*) continue ;; esac
            # A path git is configured to ignore cannot exist in a clean checkout, and a doc
            # telling the reader to CREATE one is correct precisely because it is absent.
            # docs/SelfHostedAgentServer.md names `deploy/compose/local/agent-server.yml` and
            # says in the same sentence that deploy/compose/local/ is ignored for this purpose;
            # without this the guard reads that instruction as a broken link. check-ignore is
            # asked about the path itself, so an ignored parent directory covers its children.
            if git check-ignore -q -- "$path" 2>/dev/null; then
              continue
            fi
            if [ ! -e "$path" ]; then
              echo "::error::referenced path does not exist: $path"
              grep -lF -- "$token" "${files[@]}" | sed 's/^/    referenced by: /'
              missing=$((missing + 1))
            fi
          done < <(grep -ohE -- "$pattern" "${files[@]}" | sort -u)

          echo "referenced-path guard: ${missing} missing path(s)"
          [ "$missing" -eq 0 ]

      # docs/ProjectTiers.md is the canonical repo map. It drifted to "~69 projects" while the
      # tree held 109 (MCP/A2A, applications/, samples/, spikes/, tools/ were all missing), so
      # this step fails when a tracked .csproj file name does not appear anywhere in that file.
      - name: Every tracked csproj is listed in docs/ProjectTiers.md
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          while IFS= read -r csproj; do
            name="$(basename "$csproj")"
            if ! grep -qF -- "$name" docs/ProjectTiers.md; then
              echo "::error::docs/ProjectTiers.md does not mention $name ($csproj)"
              missing=$((missing + 1))
            fi
          done < <(git ls-files -- '*.csproj' | sort)

          echo "ProjectTiers guard: ${missing} unlisted project(s) out of $(git ls-files -- '*.csproj' | wc -l | tr -d ' ')"
          [ "$missing" -eq 0 ]

      - name: Emit onboarding docs guard summary
        if: always()
        shell: bash
        run: |
          SUMMARY_FILE="${RUNNER_TEMP}/onboarding-docs-guard-summary.txt"
          {
            echo "onboarding-docs-guard summary"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "status=completed"
          } > "${SUMMARY_FILE}"

      - name: Upload onboarding docs guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-docs-guard
          path: |
            ${{ runner.temp }}/onboarding-docs-guard-summary.txt
          retention-days: 14
