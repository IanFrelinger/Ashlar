name: dr-gate

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/dr-gate*.sh'

jobs:
  dr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.403
            8.0.427
      - name: Run DR gate
        run: DR_GATE_SKIP_PRIOR=1 bash scripts/dr-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dr-gate-${{ github.run_id }}
          path: .ashlar/dr-gate/
