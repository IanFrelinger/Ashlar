name: Cert gate

on:
  pull_request:
  push:
    branches: [master]
  # Merge queue. A required check that does not run on `merge_group` never reports, and the
  # queue waits on it forever - so this is deliberately unfiltered, exactly like the
  # `pull_request` trigger above.
  merge_group:
  workflow_dispatch:

concurrency:
  group: cert-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cert-gate:
    name: cert-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 10.0.x builds (global.json); 8.0.x keeps the -f net8.0 lane on the real 8.0 runtime.
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Run cert-gate
        shell: bash
        run: bash scripts/run-cert-gate.sh

      - name: Job summary
        if: always()
        shell: bash
        run: bash scripts/cert-gate-summary.sh test-results/cert-gate.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cert-gate-trx
          path: test-results/*.trx
          if-no-files-found: warn
