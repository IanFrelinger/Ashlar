name: Dogfood Continuous Proof

# Scheduled autonomy loop sweeps on canary objectives with automatic ledger updates.
# Proves Strict extend→certify→admit pipeline stability for autonomy marketing unlock.

on:
  schedule:
    # Weekdays (Mon-Fri) at 06:00 UTC
    - cron: "0 6 * * 1-5"
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dogfood-continuous-proof.yml'
      - 'samples/autonomy-objectives/rgb-hex-parse.*'
      - 'scripts/dogfood-continuous-proof.sh'
  workflow_dispatch:

# Read-only on purpose: this workflow publishes a ledger row for a human to land, it does not
# write to the repository. See the "Publish ledger row" step for why a push cannot work here.
permissions:
  contents: read

concurrency:
  group: dogfood-continuous-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-canary-sweep:
    name: Strict canary sweep (rgb-hex-parse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Check Strict Ed25519 readiness
        id: check-strict
        shell: bash
        run: |
          set -euo pipefail
          
          # Precondition for the sweep below: does Strict still require an Ed25519 signature?
          #
          # The path was src/Ashlar.Infrastructure/Certification/CertificationVerifyOptions.cs,
          # which has never existed — the type lives in Ashlar.Certification.Contracts. So this
          # step always took the not-found branch, the sweep below was always SKIPPED, and the
          # workflow recorded a GAP row saying Strict was not ready while master had required the
          # signature for weeks. It proved nothing, in the direction of understating the product.
          STRICT_FILE="src/Ashlar.Certification.Contracts/CertificationVerifyOptions.cs"
          
          # A missing file is a FAULT IN THIS CHECK, not a fact about Strict. Recording it as a GAP
          # row would write a false statement about the product into a ledger that gates a
          # marketing claim, which is how the wrong path stayed invisible. Fail instead.
          if [[ ! -f "${STRICT_FILE}" ]]; then
            echo "::error::${STRICT_FILE} not found — this check cannot answer its question. Fix the path; do not record a GAP row."
            exit 1
          fi
          
          # Check if Strict property sets RequireEd25519Signature=true
          if grep -A 20 'public static CertificationVerifyOptions Strict' "${STRICT_FILE}" | \
             grep -q 'RequireEd25519Signature.*=.*true'; then
            echo "strict_ready=true" >> "$GITHUB_OUTPUT"
            echo "gap_reason=" >> "$GITHUB_OUTPUT"
            echo "✅ Strict Ed25519 requirement detected - PR #523 on master"
          else
            echo "strict_ready=false" >> "$GITHUB_OUTPUT"
            echo "gap_reason=Strict lacks RequireEd25519Signature=true (regression check)" >> "$GITHUB_OUTPUT"
            echo "⚠️  Strict Ed25519 requirement NOT detected - possible regression"
          fi

      - name: Run autonomy loop sweep (canary objective)
        id: sweep
        if: steps.check-strict.outputs.strict_ready == 'true'
        shell: bash
        run: |
          set +e  # Allow sweep to fail; we'll record the outcome
          
          bash scripts/dogfood-continuous-proof.sh run-canary-sweep
          SWEEP_EXIT=$?
          
          echo "sweep_exit_code=${SWEEP_EXIT}" >> "$GITHUB_OUTPUT"
          
          if [[ ${SWEEP_EXIT} -eq 0 ]]; then
            echo "sweep_outcome=PASS" >> "$GITHUB_OUTPUT"
            echo "sweep_gap=" >> "$GITHUB_OUTPUT"
          else
            echo "sweep_outcome=FAIL" >> "$GITHUB_OUTPUT"
            # "exited with code 1" and "the sweep is still a stub" are different rows, and this
            # ledger gates a marketing claim. run_canary_sweep returns 1 unconditionally today and
            # says so in its log; carry that through instead of a number nobody can act on.
            LATEST_LOG="$(ls -t test-results/dogfood-sweep-*.log 2>/dev/null | head -1 || true)"
            if [[ -n "${LATEST_LOG}" ]] && grep -q "STUB:" "${LATEST_LOG}"; then
              echo "sweep_gap=Canary sweep is still a stub in scripts/dogfood-continuous-proof.sh (run_canary_sweep returns 1 unconditionally); no autonomy loop ran." >> "$GITHUB_OUTPUT"
            else
              echo "sweep_gap=Sweep exited with code ${SWEEP_EXIT}" >> "$GITHUB_OUTPUT"
            fi
          fi
          
          exit 0  # Don't fail the workflow; we'll append the result regardless

      - name: Record GAP row (Strict not ready)
        if: steps.check-strict.outputs.strict_ready == 'false'
        shell: bash
        run: |
          bash scripts/dogfood-continuous-proof.sh append-ledger \
            "$(date -u +%Y-%m-%d)" \
            "Continuous dogfood proof canary (rgb-hex-parse)" \
            "GAP" \
            "${{ steps.check-strict.outputs.gap_reason }}" \
            "Dogfood Continuous" \
            "[CI run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Append ledger row (Strict ready)
        if: steps.check-strict.outputs.strict_ready == 'true'
        shell: bash
        run: |
          bash scripts/dogfood-continuous-proof.sh append-ledger \
            "$(date -u +%Y-%m-%d)" \
            "Continuous dogfood proof canary (rgb-hex-parse)" \
            "${{ steps.sweep.outputs.sweep_outcome }}" \
            "${{ steps.sweep.outputs.sweep_gap }}" \
            "Dogfood Continuous" \
            "[CI run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Upload sweep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-continuous-proof-${{ github.run_id }}
          path: |
            test-results/dogfood-sweep-*.log
            .ashlar/campaign/**/*.json
            .ashlar/campaign/**/*.log
          if-no-files-found: warn
          retention-days: 14

      # Was "Commit ledger update", which ran `git push origin HEAD:master`. It cannot work and
      # never has: `master` carries branch protection with five required contexts, strict mode and
      # enforce_admins, and `github-actions[bot]` has no bypass — the first run this workflow was
      # ever able to start got `remote: Permission to IanFrelinger/Ashlar.git denied to
      # github-actions[bot]` / 403, and granting `contents: write` would only move the refusal to
      # branch protection. So the row is PUBLISHED rather than pushed, and a human lands it.
      #
      # This is not a downgrade of anything that was working. The file has never been a valid
      # workflow (see the commit message shape below this step's ancestor in git history), so no
      # run of it has ever reached this point. Every row in docs/dogfood-ledger.md to date arrived
      # through a pull request.
      - name: Publish ledger row
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet docs/dogfood-ledger.md; then
            echo "No ledger changes this run."
            {
              echo "## Dogfood ledger"
              echo ""
              echo "No ledger row this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p "${RUNNER_TEMP}/ledger"
          git diff -- docs/dogfood-ledger.md > "${RUNNER_TEMP}/ledger/dogfood-ledger.patch"
          cp docs/dogfood-ledger.md "${RUNNER_TEMP}/ledger/dogfood-ledger.md"

          {
            echo "## Dogfood ledger — one row to land"
            echo ""
            echo "\`master\` is a protected branch, so this run cannot commit the row itself."
            echo "Apply the patch from the \`dogfood-ledger-${{ github.run_id }}\` artifact and open a pull request:"
            echo ""
            echo '```'
            git diff -- docs/dogfood-ledger.md | sed -n '1,40p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ledger row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-ledger-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ledger/dogfood-ledger.patch
            ${{ runner.temp }}/ledger/dogfood-ledger.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          echo "## Dogfood Continuous Proof Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run ID:** ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Canary:** rgb-hex-parse" >> "$GITHUB_STEP_SUMMARY"
          
          if [[ "${{ steps.check-strict.outputs.strict_ready }}" == "true" ]]; then
            echo "- **Strict Ready:** ✅ Yes (Ed25519 on master)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Sweep Outcome:** ${{ steps.sweep.outputs.sweep_outcome }}" >> "$GITHUB_STEP_SUMMARY"
            
            if [[ -n "${{ steps.sweep.outputs.sweep_gap }}" ]]; then
              echo "- **Gap:** ${{ steps.sweep.outputs.sweep_gap }}" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- **Strict Ready:** ❌ No" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Gap:** ${{ steps.check-strict.outputs.gap_reason }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See \`docs/dogfood-ledger.md\` for dated evidence." >> "$GITHUB_STEP_SUMMARY"
