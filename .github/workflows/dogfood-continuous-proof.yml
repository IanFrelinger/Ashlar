name: Dogfood Continuous Proof

# Scheduled autonomy loop sweeps on canary objectives with automatic ledger updates.
# Proves Strict extend→certify→admit pipeline stability for autonomy marketing unlock.

on:
  schedule:
    # Weekdays (Mon-Fri) at 06:00 UTC
    - cron: "0 6 * * 1-5"
  push:
    branches:
      - master
    paths:
      - '.github/workflows/dogfood-continuous-proof.yml'
      - 'samples/autonomy-objectives/rgb-hex-parse.*'
      - 'scripts/dogfood-continuous-proof.sh'
  workflow_dispatch:

# Read-only on purpose: this workflow publishes a ledger row for a human to land, it does not
# write to the repository. See the "Publish ledger row" step for why a push cannot work here.
permissions:
  contents: read

concurrency:
  group: dogfood-continuous-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-canary-sweep:
    name: Strict canary sweep (rgb-hex-parse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      # There was a "Check Strict Ed25519 readiness" step here that grepped
      # Ashlar.Certification.Contracts/CertificationVerifyOptions.cs for RequireEd25519Signature and
      # gated everything below on the result. It is gone, and the three reasons are worth keeping
      # because they are the reasons any source-scanning precondition in this workflow is suspect.
      #
      # 1. The regression it watched for is already MERGE-BLOCKED, behaviourally.
      #    SchemaVersionFloorTests.Strict_RejectsRecordWithoutEd25519 asserts a record without an
      #    Ed25519 signature is refused UNDER THE PRESET, and it lives in
      #    Ashlar.Tests.Infrastructure.Tests.Certification, which is inside cert-gate's filter. So it
      #    runs on every PR to master and blocks the merge. A weaker copy of that check, in a lane
      #    that runs on a schedule and cannot block anything, added a way to be wrong without adding
      #    any protection. tests/scripts/dogfood-sweep-verdict.test.sh now asserts that fact still
      #    exists, so deleting it fails a required check and says why.
      #
      # 2. It gated a sweep whose outcome cannot depend on it. The canary runs with
      #    Ashlar:Autonomy:HoldAdmission=true, and AutonomousIterationHarness returns CertifiedButHeld
      #    fifteen lines above the only Strict verification on the path. The sweep never verifies
      #    anything under Strict, so "is Strict ready" was a precondition for work it does not affect.
      #
      # 3. Its false branch wrote a GAP row blaming Strict. That is a statement about the product in a
      #    ledger that gates a marketing claim, and it was already emitted wrongly for weeks from a
      #    path that never existed. A check that can only be wrong in the direction of a false ledger
      #    row is worse than no check.
      #
      # A genuine gap is still recorded: classify_sweep_log decides PASS/GAP from what the sweep
      # actually did, and treats a disagreement between exit code and log as failure.

      - name: Mint an ephemeral certification signing key
        shell: bash
        run: |
          set -euo pipefail
          # EPHEMERAL, PER RUN, AND NEVER A REPOSITORY SECRET. SPEC-006 keeps a long-lived operator
          # key on the operator's machine and says it must never appear inside a repository;
          # revocation is deferred to v2. Unlock criterion 3a explicitly accepts a CI-GENERATED key
          # PROVIDED THE ROW SAYS SO, and the row says so in three fields the archive puts on its own
          # verdict: signerFingerprint, pinningEnabled=false and usesDevHmacKey=true.
          #
          # This key is generated here, used by this run, and discarded with the runner. NOBODY HOLDS
          # IT — which is exactly why a row signed by it counts toward 3a (loop mechanics) and toward
          # nothing else. It is NOT custody, and pinning to a key CI generated and threw away would
          # be pinning to nobody, so criterion 3b is untouched by this step.
          #
          # CertificationRecordSigner resolves ASHLAR_CERT_ED25519_KEY through
          # CertificationRecordEd25519.ResolvePrivateKey, which requires Base64 of 32 raw bytes;
          # `openssl rand -base64 32` is exactly that. The mask is written BEFORE the value reaches
          # the environment file, so a later step that dumps the environment cannot print it.
          KEY="$(openssl rand -base64 32)"
          echo "::add-mask::${KEY}"
          echo "ASHLAR_CERT_ED25519_KEY=${KEY}" >> "$GITHUB_ENV"
          echo "Minted an ephemeral Ed25519 signing key for this run (value masked, never logged)."

      - name: Run autonomy loop sweep (canary objective)
        id: sweep
        shell: bash
        run: |
          set +e  # Allow sweep to fail; we'll record the outcome

          bash scripts/dogfood-continuous-proof.sh run-canary-sweep
          SWEEP_EXIT=$?

          echo "sweep_exit_code=${SWEEP_EXIT}" >> "$GITHUB_OUTPUT"

          LATEST_LOG="$(ls -t test-results/dogfood-sweep-*.log 2>/dev/null | head -1 || true)"

          # The record citation the sweep emitted, if any. A row that counts toward 3a has to carry
          # this line; a row without it does not count, whatever its Pass/Fail cell says.
          EVIDENCE=""
          if [[ -n "${LATEST_LOG}" ]]; then
            EVIDENCE="$(grep -o 'SWEEP EVIDENCE: .*' "${LATEST_LOG}" | head -1 \
              | sed 's/^SWEEP EVIDENCE: //' || true)"
          fi
          echo "sweep_evidence=${EVIDENCE}" >> "$GITHUB_OUTPUT"

          if [[ ${SWEEP_EXIT} -eq 0 ]]; then
            echo "sweep_outcome=PASS" >> "$GITHUB_OUTPUT"
            echo "sweep_gap=Counts toward 3a: ${EVIDENCE}. The record was re-read from that file and verified under Strict. pinned=false means nothing pins that signer, so this record verifies exactly as one signed by any other keypair would; dev-hmac=true means the symmetric half is the committed development key. The Ed25519 key was minted by this CI run and discarded with it - no operator holds it. Does NOT count toward 3b (no operator custody) or 4 (fixture canary, not a real hygiene PR)." >> "$GITHUB_OUTPUT"
          elif [[ ${SWEEP_EXIT} -eq 3 ]]; then
            # Exit 3 is "the iteration reached a verdict, but its record did not persist and
            # re-verify". It gets its OWN branch deliberately: folding it into 2 would report a
            # record-verification gap as a sandbox infrastructure fault, and folding it into 0 would
            # write a PASS row citing a record nobody can open. Both are the pre-#630 error shape.
            echo "sweep_outcome=GAP" >> "$GITHUB_OUTPUT"
            WHY=""
            if [[ -n "${LATEST_LOG}" ]]; then
              WHY="$(grep -o 'SWEEP: the record did not persist-and-verify: .*' "${LATEST_LOG}" \
                | head -1 | sed 's/^SWEEP: the record did not persist-and-verify: //' || true)"
            fi
            echo "sweep_gap=The iteration reached a verdict but its record did not persist and re-verify under Strict: ${WHY:-see the attached log}. This is a loop-mechanics gap, not a candidate failure, and it does not count toward 3a." >> "$GITHUB_OUTPUT"
          elif [[ ${SWEEP_EXIT} -eq 2 ]]; then
            # Exit 2 is "an objective was attempted and the iteration errored before reaching any
            # verdict". Reporting that as PASS is the specific failure this branch exists to stop:
            # run 34889059104 did exactly that, because the sandbox image was absent and the loop
            # counts a throwing iteration as attempted. An infrastructure fault is a GAP.
            echo "sweep_outcome=GAP" >> "$GITHUB_OUTPUT"
            WHY=""
            if [[ -n "${LATEST_LOG}" ]]; then
              WHY="$(grep -o 'SWEEP: the iteration did not reach a verdict: .*' "${LATEST_LOG}" \
                | head -1 | sed 's/^SWEEP: the iteration did not reach a verdict: //' || true)"
            fi
            echo "sweep_gap=The loop attempted the objective but the iteration never reached a verdict: ${WHY:-see the attached log}" >> "$GITHUB_OUTPUT"
          else
            echo "sweep_outcome=FAIL" >> "$GITHUB_OUTPUT"
            # "exited with code 1" and a named unmet precondition are different rows, and this
            # ledger gates a marketing claim. run_canary_sweep names each failed precondition in
            # its log; carry that through instead of a number nobody can act on.
            PRECONDITIONS=""
            if [[ -n "${LATEST_LOG}" ]]; then
              PRECONDITIONS="$(grep 'PRECONDITION FAILED:' "${LATEST_LOG}" | sed 's/PRECONDITION FAILED: //' | paste -sd'; ' - || true)"
            fi
            if [[ -n "${PRECONDITIONS}" ]]; then
              echo "sweep_gap=Sweep refused to run: ${PRECONDITIONS}" >> "$GITHUB_OUTPUT"
            elif [[ -n "${LATEST_LOG}" ]] && grep -q 'attempted no objective' "${LATEST_LOG}"; then
              echo "sweep_gap=The loop ran but attempted no objective - no pending objective was eligible (missing witness or proposal)." >> "$GITHUB_OUTPUT"
            else
              echo "sweep_gap=Sweep exited with code ${SWEEP_EXIT}; see the attached log." >> "$GITHUB_OUTPUT"
            fi
          fi
          
          exit 0  # Don't fail the workflow; we'll append the result regardless

      - name: Append ledger row
        shell: bash
        run: |
          bash scripts/dogfood-continuous-proof.sh append-ledger \
            "$(date -u +%Y-%m-%d)" \
            "Continuous dogfood proof canary (rgb-hex-parse)" \
            "${{ steps.sweep.outputs.sweep_outcome }}" \
            "${{ steps.sweep.outputs.sweep_gap }}" \
            "Dogfood Continuous" \
            "[CI run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}); ${{ steps.sweep.outputs.sweep_evidence || 'no record citation this run' }}"

      - name: Upload sweep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-continuous-proof-${{ github.run_id }}
          path: |
            test-results/dogfood-sweep-*.log
            .ashlar/campaign/**/*.json
            .ashlar/campaign/**/*.log
          if-no-files-found: warn
          retention-days: 14

      # Was "Commit ledger update", which ran `git push origin HEAD:master`. It cannot work and
      # never has: `master` carries branch protection with five required contexts, strict mode and
      # enforce_admins, and `github-actions[bot]` has no bypass — the first run this workflow was
      # ever able to start got `remote: Permission to IanFrelinger/Ashlar.git denied to
      # github-actions[bot]` / 403, and granting `contents: write` would only move the refusal to
      # branch protection. So the row is PUBLISHED rather than pushed, and a human lands it.
      #
      # This is not a downgrade of anything that was working. The file has never been a valid
      # workflow (see the commit message shape below this step's ancestor in git history), so no
      # run of it has ever reached this point. Every row in docs/dogfood-ledger.md to date arrived
      # through a pull request.
      - name: Publish ledger row
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet docs/dogfood-ledger.md; then
            echo "No ledger changes this run."
            {
              echo "## Dogfood ledger"
              echo ""
              echo "No ledger row this run."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p "${RUNNER_TEMP}/ledger"
          git diff -- docs/dogfood-ledger.md > "${RUNNER_TEMP}/ledger/dogfood-ledger.patch"
          cp docs/dogfood-ledger.md "${RUNNER_TEMP}/ledger/dogfood-ledger.md"

          # Stage the CITED artefacts beside the row, so the human who lands the row lands the
          # record it cites. A citation a reviewer cannot open is not a citation, and this
          # workflow's own sweep artifacts expire in 14 days.
          #
          # WHETHER THOSE FILES ARE THEN COMMITTED TO THE REPOSITORY IS NOT DECIDED HERE. Staging
          # them makes both options available; putting model-adjacent output into docs/ is a call
          # for the repository's owner. Until it is made, the citation points into artifact storage
          # and therefore dangles after 14 days — which docs/dogfood-scorecard.md already names as
          # "a row left in CI artifact storage is evidence nobody can review".
          mkdir -p "${RUNNER_TEMP}/ledger/record"
          find .ashlar/campaign -type f \( -name '*.evidence.json' -o -path '*/records/*.json' \) \
            -exec cp {} "${RUNNER_TEMP}/ledger/record/" \; 2>/dev/null || true
          ls -la "${RUNNER_TEMP}/ledger/record/" || true

          {
            echo "## Dogfood ledger — one row to land"
            echo ""
            echo "\`master\` is a protected branch, so this run cannot commit the row itself."
            echo "Apply the patch from the \`dogfood-ledger-${{ github.run_id }}\` artifact and open a pull request:"
            echo ""
            echo '```'
            git diff -- docs/dogfood-ledger.md | sed -n '1,40p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ledger row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-ledger-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ledger/dogfood-ledger.patch
            ${{ runner.temp }}/ledger/dogfood-ledger.md
            ${{ runner.temp }}/ledger/record/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Workflow summary
        if: always()
        shell: bash
        run: |
          echo "## Dogfood Continuous Proof Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run ID:** ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Canary:** rgb-hex-parse" >> "$GITHUB_STEP_SUMMARY"
          
          echo "- **Sweep Outcome:** ${{ steps.sweep.outputs.sweep_outcome }}" >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "${{ steps.sweep.outputs.sweep_gap }}" ]]; then
            echo "- **Gap:** ${{ steps.sweep.outputs.sweep_gap }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          # The record's own verdict. Reported as the archive computed it, with no line claiming
          # anything about pinning or operator custody: this run's signing key was generated here
          # and thrown away, so there is no custody to report and nothing pins it.
          if [[ -n "${{ steps.sweep.outputs.sweep_evidence }}" ]]; then
            echo "- **Record:** \`${{ steps.sweep.outputs.sweep_evidence }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Strict re-verification:** PASS (the record was re-read from that file, not from memory)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Signer:** ephemeral, generated by this run and discarded with it; nothing pins it" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Strict re-verification:** NONE — this run produced no reviewable record, so it counts toward criterion 3a not at all" >> "$GITHUB_STEP_SUMMARY"
          fi

          # No "Strict Ready" line any more, and its absence is the honest position rather than an
          # omission. This summary is about what the sweep did; the sweep runs with HoldAdmission=true
          # and never reaches a Strict verification, so reporting Strict's configuration beside a
          # sweep outcome invited exactly the reading that the sweep had verified something under it.
          # Whether Strict still requires Ed25519 is asserted, behaviourally and merge-blockingly, by
          # SchemaVersionFloorTests.Strict_RejectsRecordWithoutEd25519 in cert-gate.
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See \`docs/dogfood-ledger.md\` for dated evidence." >> "$GITHUB_STEP_SUMMARY"
