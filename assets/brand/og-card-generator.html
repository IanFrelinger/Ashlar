<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=630">
    <title>Ashlar OG Card Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: #F7F2E5; /* cream */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        }
        
        .card {
            width: 1200px;
            height: 630px;
            background: #F7F2E5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px;
        }
        
        /* The same lockup as the README and the site header: the wordmark and the Trace mark. */
        .lockup {
            display: block;
            height: 150px;
            width: auto;
            margin-bottom: 32px;
        }
        
        .subtitle {
            font-size: 32px;
            color: #4A5540; /* olive */
            text-align: center;
            max-width: 900px;
            line-height: 1.4;
            font-weight: 400;
        }
        
        .footer {
            margin-top: 50px;
            font-size: 20px;
            color: #7E8F6E; /* sage */
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="lockup" src="ashlar-logo-flat.svg" alt="Ashlar">
        
        <p class="subtitle">Local-first .NET runtime for auditable AI workflows you embed</p>
        
        <p class="footer">github.com/IanFrelinger/Ashlar</p>
    </div>
    
    <!-- INSTRUCTIONS FOR EXPORT:
    
    The lockup is loaded from ashlar-logo-flat.svg beside this file, so the card always matches the README and
    the site header. Render this page at exactly 1200x630 and save the PNG as
    assets/brand/ashlar-og-flat-1200x630.png, either with generate-og-card.sh or with headless Chrome:
    
    chrome --headless=new --hide-scrollbars --window-size=1200,630 \
        --screenshot=assets/brand/ashlar-og-flat-1200x630.png file://$(pwd)/assets/brand/og-card-generator.html
    
    -->
</body>
</html>
