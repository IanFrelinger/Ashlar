name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore --configfile nuget.config
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test with real PR (rate-limited, best effort)
      run: |
        # Test against a stable, merged Microsoft Terminal PR
        # This is best-effort - may hit rate limits without GITHUB_TOKEN
        dotnet run --project src/PrBlocker.CLI --no-build --configuration Release -- \
          https://github.com/microsoft/terminal/pull/17796 || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
