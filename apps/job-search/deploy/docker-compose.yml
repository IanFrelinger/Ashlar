# Job Search Studio on one server (docs/STUDIO.md §4). Caddy terminates TLS; the studio serves the app; Ollama is the
# private model for personal data. The studio and Ollama share one network namespace, held by the `pod` container,
# so the studio reaches the model on 127.0.0.1, the only address the app accepts for a model that may see personal
# data. Nothing else can reach the model: Ollama listens on that namespace's loopback, and Caddy, in its own
# namespace, reaches only the studio's port (as pod:8080). A studio or Ollama restart rejoins the pod's namespace.
#
# Run from /opt/jobsearch on the server (deploy/README.md). Compose reads .env there for STUDIO_IMAGE,
# STUDIO_DOMAIN and ACME_EMAIL; the studio's secrets come from studio.env, which jobsearch-env writes from the
# parameter store at each start.
name: jobsearch

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  pod:
    image: busybox:1.37
    command: ["tail", "-f", "/dev/null"]
    init: true
    restart: unless-stopped
    networks: [web]
    logging: *logging

  studio:
    image: ${STUDIO_IMAGE:?STUDIO_IMAGE is not set}
    network_mode: service:pod
    restart: unless-stopped
    env_file: [studio.env]
    environment:
      JOBSEARCH_URLS: http://0.0.0.0:8080
      JOBSEARCH_PUBLIC_URL: https://${STUDIO_DOMAIN:?STUDIO_DOMAIN is not set}
      JOBSEARCH_GOOGLE_MODE: google
      JOBSEARCH_PRIVATE_MODEL_URL: http://127.0.0.1:11434/
      JOBSEARCH_PRIVATE_MODEL: ${PRIVATE_MODEL:-llama3.1:8b}
    volumes:
      - ${DATA_DIR:-/srv/jobsearch/data}:/data
    read_only: true
    tmpfs: [/tmp:size=512m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    pids_limit: 512
    logging: *logging

  ollama:
    image: ollama/ollama:0.40.12
    network_mode: service:pod
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ${OLLAMA_DIR:-/srv/jobsearch/ollama}:/root/.ollama
    security_opt: [no-new-privileges:true]
    mem_limit: 9g
    logging: *logging

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    depends_on: [studio]
    ports: ["80:80", "443:443", "443:443/udp"]
    networks: [web]
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is not set}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DIR:-/srv/jobsearch/caddy}:/data
    security_opt: [no-new-privileges:true]
    logging: *logging

networks:
  web: {}
